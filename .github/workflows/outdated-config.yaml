---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Outdated Config

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    name: Outdated Config - Report
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup flate
        uses: home-operations/flate/action@bbb6ebc344da051752dbdb1b413860ceffcfb63d # v0.7.3
        with:
          version: "0.7.3"
          base: ""

      # 诊断信息（未使用的 values、冲突的产出方）只写在 stderr
      - name: Render manifests
        run: >-
          flate build --no-progress
          --path k8s/clusters/staging
          --supply .github/flate/inputs.yaml
          --skip-kinds Secret > rendered.yaml 2> flate.log

      - name: Collect findings
        run: |
          scripts/check-deprecated-apis.sh rendered.yaml > api.txt || true
          python3 scripts/check-schema-versions.py > schema.txt || true
          # flate 看不到 fluent-bit 配置里 tpl 对 .Values.logLevel 的引用，该条 StaleValues 是误报
          grep -A1 -E '\[(StaleValues|ConflictingProducers)\]' flate.log | grep -v '^--$' |
            awk '/StaleValues\] HelmRelease observability\/fluent-bit:/ {skip=1; next} skip {skip=0; next} {print}' > diagnostics.txt || true

          section() {
            if [[ -s $2 ]]; then
              printf '### %s\n\n```text\n%s\n```\n\n' "$1" "$(cat "$2")"
            fi
          }
          {
            section "已弃用或已停止提供的 API 版本" api.txt
            section "schema 注释与 apiVersion 不一致" schema.txt
            section "未使用的 values / 冲突的产出方（flate 诊断）" diagnostics.txt
          } > sections.md

          if [[ -s sections.md ]]; then
            {
              echo "由 Outdated Config 工作流每周生成，全部清零后自动关闭。"
              echo "最近一次运行：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              cat sections.md
            } > body.md
          fi

      - name: Sync issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 过时配置报告
        run: |
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq "map(select(.title == \"$TITLE\"))[0].number // empty")

          if [[ -s body.md ]]; then
            if [[ -n $number ]]; then
              gh issue edit "$number" --body-file body.md
            else
              gh issue create --title "$TITLE" --body-file body.md
            fi
          elif [[ -n $number ]]; then
            gh issue close "$number" --comment "本次检查未发现过时配置。"
          fi
