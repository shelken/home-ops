---
name: Flate

on:
  pull_request:
    branches: ["main"]
    paths:
      - k8s/**
      - .github/workflows/flate.yaml
      - .github/flate/**
      - .taskfile/flux.yaml
      - scripts/validate-schemas.sh
      - mise.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Flate - Test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup flate
        uses: home-operations/flate/action@bbb6ebc344da051752dbdb1b413860ceffcfb63d # v0.7.3
        with:
          version: "0.7.3"
          base: ""

      - name: Render and test all resources
        run: >-
          flate test
          --path k8s/clusters/staging
          --supply .github/flate/inputs.yaml
          --strict-substitutions

  diff:
    name: Flate - Diff
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resource: ["helmrelease", "kustomization"]
      fail-fast: false
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pull
          persist-credentials: false

      - name: Checkout Default Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: default
          persist-credentials: false
          ref: "${{ github.event.repository.default_branch }}"

      - name: Setup flate
        uses: home-operations/flate/action@bbb6ebc344da051752dbdb1b413860ceffcfb63d # v0.7.3
        with:
          version: "0.7.3"
          base: ""

      - name: Render changed resources and diff
        env:
          RESOURCE: ${{ matrix.resource }}
        run: >-
          flate diff "$RESOURCE"
          --path pull/k8s/clusters/staging
          --path-orig default/k8s/clusters/staging
          --supply pull/.github/flate/inputs.yaml
          --strict-substitutions
          --output diff > diff.patch

      - name: Generate Diff
        id: diff
        run: |
          delimiter=$(uuidgen)
          {
            echo "diff<<$delimiter"
            head -c 10000 diff.patch
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - if: ${{ steps.diff.outputs.diff != '' }}
        name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - if: ${{ steps.diff.outputs.diff != '' }}
        name: Add Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          header: ${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resource }}
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

  schema:
    name: Flate - Schema
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup flate
        uses: home-operations/flate/action@bbb6ebc344da051752dbdb1b413860ceffcfb63d # v0.7.3
        with:
          version: "0.7.3"
          base: ""

      - name: Render manifests
        run: >-
          flate build
          --path k8s/clusters/staging
          --supply .github/flate/inputs.yaml
          --strict-substitutions
          --skip-kinds Secret > rendered.yaml

      # kubeconform 版本取自 mise.toml（本地与 CI 同一来源）
      - name: Validate against CRD schemas
        run: |
          version=$(sed -n 's/^kubeconform = "\(.*\)"/\1/p' mise.toml)
          KUBECONFORM="docker run --rm -i ghcr.io/yannh/kubeconform:v${version}" \
            scripts/validate-schemas.sh rendered.yaml

  success:
    if: ${{ !cancelled() }}
    needs: ["test", "diff", "schema"]
    name: Flate - Success
    runs-on: ubuntu-26.04
    steps:
      - name: Require all checks to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'all(.[]; . == "success")' <<< "$RESULTS"
