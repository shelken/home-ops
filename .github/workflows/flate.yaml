---
name: Flate

on:
  pull_request:
    branches: ["main"]
    paths:
      - k8s/**
      - .github/workflows/flate.yaml
      - .github/flate/**
      - .taskfile/flux.yaml
      - scripts/validate-schemas.sh
      - scripts/check-deprecated-apis.sh
      - scripts/summarize-flate-failures.sh
      - mise.toml
  # main 上的运行负责产出缓存，PR 只能读取 main 分支保存的缓存
  push:
    branches: ["main"]
    paths:
      - k8s/**
      - .github/workflows/flate.yaml
      - .github/flate/**
      - .taskfile/flux.yaml
      - scripts/validate-schemas.sh
      - scripts/check-deprecated-apis.sh
      - scripts/summarize-flate-failures.sh
      - mise.toml
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Flate - Validate
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup flate
        uses: home-operations/flate/action@bbb6ebc344da051752dbdb1b413860ceffcfb63d # v0.7.3
        with:
          version: "0.7.3"
          base: ""
          cache: "true"

      # 一次渲染供下面所有检查共用；失败时仍保留部分产物，让静态检查独立给出结果
      - name: Render manifests
        id: render
        continue-on-error: true
        run: |
          rc=0
          flate build --no-progress \
            --path k8s/clusters/staging \
            --supply .github/flate/inputs.yaml \
            --skip-kinds Secret > rendered.yaml 2> flate.log || rc=$?
          cat flate.log
          exit "$rc"

      - name: Summarize render failures
        if: ${{ steps.render.outcome == 'failure' }}
        run: scripts/summarize-flate-failures.sh flate.log | tee -a "$GITHUB_STEP_SUMMARY"

      # 已弃用版本只报告，已停止提供的版本会让检查失败
      - name: Check deprecated API versions
        if: ${{ !cancelled() }}
        run: scripts/check-deprecated-apis.sh rendered.yaml

      # kubeconform 版本取自 mise.toml（本地与 CI 同一来源）
      - name: Validate against CRD schemas
        if: ${{ !cancelled() }}
        run: |
          version=$(sed -n 's/^kubeconform = "\(.*\)"/\1/p' mise.toml)
          KUBECONFORM="docker run --rm -i ghcr.io/yannh/kubeconform:v${version}" \
            scripts/validate-schemas.sh rendered.yaml

      - name: Require complete render
        if: ${{ steps.render.outcome == 'failure' }}
        run: |
          echo "::error::渲染未完成，上面的检查只覆盖了部分资源"
          exit 1

  diff:
    if: ${{ github.event_name == 'pull_request' }}
    name: Flate - Diff
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resource: ["helmrelease", "kustomization"]
      fail-fast: false
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pull
          persist-credentials: false

      - name: Checkout Default Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: default
          persist-credentials: false
          ref: "${{ github.event.repository.default_branch }}"

      - name: Setup flate
        uses: home-operations/flate/action@bbb6ebc344da051752dbdb1b413860ceffcfb63d # v0.7.3
        with:
          version: "0.7.3"
          base: ""
          cache: "true"

      - name: Render changed resources and diff
        env:
          RESOURCE: ${{ matrix.resource }}
        run: >-
          flate diff "$RESOURCE"
          --path pull/k8s/clusters/staging
          --path-orig default/k8s/clusters/staging
          --output diff > diff.patch

      - name: Generate Diff
        id: diff
        run: |
          delimiter=$(uuidgen)
          {
            echo "diff<<$delimiter"
            head -c 10000 diff.patch
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - if: ${{ steps.diff.outputs.diff != '' }}
        name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - if: ${{ steps.diff.outputs.diff != '' }}
        name: Add Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          header: ${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resource }}
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

  success:
    if: ${{ !cancelled() }}
    needs: ["validate", "diff"]
    name: Flate - Success
    runs-on: ubuntu-26.04
    steps:
      - name: Require all checks to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          # push 到 main 时 diff 作业被跳过
          jq -e 'all(.[]; . == "success" or . == "skipped")' <<< "$RESULTS"
