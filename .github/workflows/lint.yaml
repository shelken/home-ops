---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint - Repository checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 只装这几个：mise.toml 里还有 homeassistant-cli 与 mc，全量安装既不必要也很慢。
      # pipx 是 yamllint 的安装后端，必须在它之前装上（install: false 时不会自动带出来）
      - name: Install mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: false

      - name: Install lint tools
        run: mise install pipx yamllint ruff shellcheck

      - name: yamllint
        run: yamllint --config-file .yamllint $(git ls-files '*.yaml' '*.yml')

      - name: ruff
        run: ruff check $(git ls-files '*.py')

      - name: shellcheck
        run: shellcheck $(git ls-files '*.sh')

      - name: markdown relative links
        run: git ls-files -z '*.md' | xargs -0 python3 scripts/check-markdown-links.py
