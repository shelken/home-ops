---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint - Repository checks
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 三个工具都从 PyPI 装，版本取自 mise.toml（本地与 CI 同一来源）。
      # 不用 mise：它的二进制与签名文件只能匿名下载 github.com/releases，
      # GitHub 匿名流量故障（504）时整个 job 会挂；runner 镜像里的版本又随镜像漂移
      # （ubuntu-24.04 的 shellcheck 是 0.9.0）。shellcheck-py 的版本号是 <上游版本>.<打包修订>。
      - name: Install lint tools
        run: |
          pin() { sed -n "s/^$1 = \"\(.*\)\"/\1/p" mise.toml; }
          pipx install "yamllint==$(pin yamllint)"
          pipx install "ruff==$(pin ruff)"
          pipx install "shellcheck-py==$(pin shellcheck).*"

      - name: yamllint
        run: yamllint --config-file .yamllint $(git ls-files '*.yaml' '*.yml')

      - name: ruff
        run: ruff check $(git ls-files '*.py')

      - name: shellcheck
        run: shellcheck $(git ls-files '*.sh')

      - name: markdown relative links
        run: git ls-files -z '*.md' | xargs -0 python3 scripts/check-markdown-links.py

      - name: schema comment versions
        run: python3 scripts/check-schema-versions.py

      - name: registry mirror probes
        run: python3 scripts/check-registry-mirror-probes.py
