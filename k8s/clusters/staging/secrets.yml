---
# 每个 namespace 一个 cluster-vars：唯一负责把 cluster-secrets / cluster-settings 写进该 namespace。
# 无 dependsOn，因此 revision 变更后立即应用，不等待 infra/apps 的 health 链；
# 子级 Kustomization 的 postBuild 依赖本对象先就绪，避免"父级链没跑完 → 变量还是旧值 → 子级重试无效"的长卡死。
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-vars
  namespace: cert-manager
  labels:
    substitution.flux/disabled: "true"
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 2m
  path: ./k8s/components/common/cluster-vars
  prune: true
  wait: true
  targetNamespace: cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
