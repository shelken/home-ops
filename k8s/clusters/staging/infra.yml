apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  # postBuild:
  #   substituteFrom:
  #     - kind: Secret
  #       name: cluster-secrets
  #     - kind: ConfigMap
  #       name: cluster-settings
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k8s/infra/staging
  prune: true
  # Ready 只代表清单 apply 完成；不递归等待全部孙级健康。
  # 2025-10-25 加 wait:true 是为集群重建期的顺序需求，稳态下它把任意孙级失败放大成
  # app 层全局冻结（2026-09-28 certificates 竞态冻结 apps 14 分钟；postmortem 020 数周）。
  # apps 与 infra 的真实依赖（CRD/控制器存在）由子级自身 dependsOn + retryInterval 表达。
  wait: false
  patches:
    - # Add Sops decryption to child Kustomizations
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: dummy
        spec:
          decryption:
            provider: sops
            secretRef:
              name: sops-age
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
    - patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: not-important
        spec:
          postBuild:
            substituteFrom:
              - kind: Secret
                name: cluster-secrets
              - kind: ConfigMap
                name: cluster-settings
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
        labelSelector: substitution.flux/disabled notin (true)
