---
# IfNotPresent 保证集群已有 Bound PVC 不会被 Flux 覆盖修改 immutable 字段；
# 新应用部署或容灾恢复时，由 dataSourceRef 触发 Kopiur volume populator 自动从快照恢复。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ${APP}
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  accessModes:
    - ${KOPIUR_ACCESSMODES:=ReadWriteOnce}
  dataSourceRef:
    apiGroup: kopiur.home-operations.com
    kind: Restore
    name: ${APP}
  resources:
    requests:
      storage: ${KOPIUR_CAPACITY:=1Gi}
  storageClassName: ${KOPIUR_STORAGECLASS:=longhorn}
