---
# yaml-language-server: $schema=https://raw.githubusercontent.com/home-operations/kopiur/main/deploy/crds/snapshotpolicies.yaml
# 云端异地副本：与 ${APP} 本地策略完全独立。每天一次而非每小时，
# 因此不会在云端累积小时级 SQLite 碎片包，也就不触发小包合并带来的周期性全量重传。
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}-cloud
spec:
  compression:
    compressor: zstd
  credentialProjection:
    enabled: true
  mover:
    # 云端每天一次，冷缓存只影响上传速度，不值得为每个应用常驻一块 PVC。
    cache:
      capacity: ${KOPIUR_CLOUD_CACHE_CAPACITY:=2Gi}
      mode: Ephemeral
      storageClassName: ${KOPIUR_CACHE_STORAGECLASS:=longhorn-cache}
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
  repository:
    kind: ClusterRepository
    name: cloud-openlist
  # 每天一份，仅保留 7 天；保留量由本地仓库承担细粒度回滚。
  retention:
    keepLatest: 2
    keepDaily: 7
  sources:
    - pvc:
        name: ${APP}
  staging:
    storageClassName: ${KOPIUR_STAGING_STORAGECLASS:=longhorn-snapshot}
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=longhorn-snapclass}
