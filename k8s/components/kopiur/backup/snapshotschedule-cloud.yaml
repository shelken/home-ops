---
# yaml-language-server: $schema=https://raw.githubusercontent.com/home-operations/kopiur/main/deploy/crds/snapshotschedules.yaml
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: ${APP}-cloud
spec:
  policyRef:
    name: ${APP}-cloud
  schedule:
    # 每天低峰一次；H 仍然按对象确定性错峰分钟，避免所有应用同一分钟上云。
    cron: H 4 * * *
    jitter: 30m
    runOnCreate: false
