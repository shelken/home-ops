---
# cluster-secrets / cluster-settings 的单一来源，由 k8s/clusters/staging/secrets.yml 里每个
# namespace 一个 cluster-vars Kustomization 应用（targetNamespace 指向该 namespace）。
# 不放进各 namespace tree 的原因：tree 由 infra/apps 父级应用，父级的 health 链未跑完前
# 本 namespace 的副本不会更新，子级 postBuild 会一直失败到父级链结束。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cluster-settings.yaml
  - cluster-secret.sops.yaml
