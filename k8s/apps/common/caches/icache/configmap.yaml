---
apiVersion: v1
kind: ConfigMap
metadata:
  name: icache-nginx-config
data:
  nginx.conf: |
    worker_processes auto;
    error_log stderr warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /usr/local/openresty/nginx/conf/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" cache:$upstream_cache_status '
                        'uct:$upstream_connect_time rt:$request_time';

        access_log /dev/stdout main;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        # temp paths for non-root
        client_body_temp_path /tmp/client_body;
        proxy_temp_path /tmp/proxy;
        fastcgi_temp_path /tmp/fastcgi;
        uwsgi_temp_path /tmp/uwsgi;
        scgi_temp_path /tmp/scgi;

        proxy_cache_path /cache levels=1:2 keys_zone=proxy_cache:100m max_size=10g inactive=30d use_temp_path=off;

        # 只用集群 DNS：nginx 在多个 resolver 之间轮询，公共 DNS 会绕开节点的分流解析（ADR-0004）
        resolver kube-dns.kube-system.svc.cluster.local valid=300s ipv6=off;
        resolver_timeout 10s;

        # 每个上游一个 upstream 块：proxy_pass 用变量直连域名时没有连接池，每个请求都要重新 TLS 握手
        upstream cache_nixos_org {
            zone cache_nixos_org 64k;
            server cache.nixos.org:443 resolve;
            keepalive 16;
        }

        upstream nix_community_cachix_org {
            zone nix_community_cachix_org 64k;
            server nix-community.cachix.org:443 resolve;
            keepalive 16;
        }

        # 白名单：路径里的主机名 -> upstream 块名，空值即拒绝
        map $target_host $backend {
            default "";
            "cache.nixos.org" cache_nixos_org;
            "nix-community.cachix.org" nix_community_cachix_org;
        }

        server {
            listen 8080;
            server_name _;

            # 以下回源与缓存设置由所有代理 location 共用
            proxy_http_version 1.1;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            proxy_pass_request_headers off;

            proxy_cache proxy_cache;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_revalidate on;

            # 缓存时长只由下面两行决定，不采信上游的缓存头
            proxy_ignore_headers Cache-Control Expires Set-Cookie X-Accel-Expires;
            proxy_cache_valid 200 30d;
            # 与 Nix 客户端自己的负缓存时长（narinfo-cache-negative-ttl，默认 1 小时）一致
            proxy_cache_valid 404 1h;

            # healthz 等非代理 location 不设置该变量，先给空值，避免每次探测都刷 uninitialized 告警
            set $target_host "";
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Target-Host $target_host always;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;

            location = /healthz {
                access_log off;
                default_type text/plain;
                return 200 "ok";
            }

            location = /status {
                access_log off;
                default_type text/plain;
                return 200 "icache proxy running\n";
            }

            # /<上游主机名>/<路径>
            location ~ ^/([^/]+)(/.*)?$ {
                set $target_host $1;
                set $target_path $2;

                if ($backend = "") {
                    return 403 "Domain not in whitelist";
                }

                proxy_pass https://$backend$target_path$is_args$args;
                proxy_set_header Connection "";
                proxy_set_header Host $target_host;
                proxy_set_header Accept */*;
                proxy_set_header User-Agent "Mozilla/5.0 (compatible; icache/1.0)";
                proxy_ssl_server_name on;
                proxy_ssl_name $target_host;
                proxy_cache_key $target_host$target_path$is_args$args;
            }
        }
    }
