---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-assistant
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/authelia
  dependsOn:
    - name: azure-store
      namespace: external-secrets
    - name: kopiur-repository
      namespace: kopiur-system
    - name: multus-networks
      namespace: network
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 5Gi
      KOPIUR_CACHE_CAPACITY: 5Gi
      AUTHELIA_ROUTE: home-assistant-code-server
  interval: 1h
  path: ./k8s/apps/common/home-assistant/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: false
