---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app icloudpd
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      icloudpd:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/icloudpd/icloudpd
              tag: 1.32.3@sha256:af2bf40cb2c1d42051793b4c3c04c825950697d7fedcd12bd8455d6952395801
            env:
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: icloudpd-secret
            args:
              - icloudpd
              - --log-level=debug
              - --no-progress-bar
              - --watch-with-interval=21600
              - --mfa-provider=webui
              - --password-provider=webui
              - --domain=cn
              - --username
              - $(APPLE_ID)
              - --directory=/data
              - --cookie-directory=/config
              - --auto-delete
              - --size=original
              - --keep-unicode-in-filenames
              - --folder-structure={:%Y/%m/%d}
              - --smtp-host=$(SMTP_HOST)
              - --smtp-port=$(SMTP_PORT)
              - --smtp-username=$(SMTP_USERNAME)
              - --smtp-password=$(SMTP_PASSWORD)
              - --notification-email=$(NOTIFICATION_EMAIL)
              - --notification-email-from=$(NOTIFICATION_EMAIL_FROM)
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 10
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                memory: 32Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: internal
          gethomepage.dev/name: icloudpd
          gethomepage.dev/icon: icloud.svg
          gethomepage.dev/description: "同步 iCloud 照片"
        hostnames:
          - "{{ .Release.Name }}.${MAIN_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        # existingClaim: *app
        forceRename: *app
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 100Mi
        globalMounts:
          - path: /config
      data:
        existingClaim: smb-sakamoto-media
        globalMounts:
          - path: /data
            subPath: Photo/icloudpd/shelken
      tmpfs:
        type: emptyDir
        advancedMounts:
          icloudpd:
            app:
              - path: /tmp
                subPath: tmp
