---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app commandcode
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      commandcode:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # 上游只发 latest/release 标签, 因此按摘要固定; 上游发布 semver 标签后改为 <version>@sha256:<digest>
              repository: ghcr.io/maxeaglet/commandcode-proxy
              tag: latest@sha256:423113c65eadb34f918c998fb5a35ee62b1bd94f3b555e31bb8bfca4ac9519a3
            env:
              TZ: ${TIMEZONE}
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 3050
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      config:
        type: configMap
        name: commandcode-config
        globalMounts:
          - path: /app/config.json
            subPath: config.json
            readOnly: true
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: internal
          gethomepage.dev/name: *app
          gethomepage.dev/icon: kubernetes-dashboard.svg
        hostnames:
          - "{{ .Release.Name }}.${MAIN_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
