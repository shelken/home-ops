---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app neko-master
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      neko-master:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: foru17/neko-master
              tag: 1.4.3@sha256:e0aadd60166db0791f4f7a0465626bcc6ab5dadb4204828ddbfc1893a167265b
            env:
              TZ: ${TIMEZONE}
              DB_PATH: /app/data/stats.db
              # 默认 online 会把目标 IP 发给第三方接口
              GEOIP_LOOKUP_PROVIDER: local
              GEOIP_MMDB_DIR: /app/data/geoip
              COOKIE_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: neko-master-secret
                    key: COOKIE_SECRET
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3001
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 6
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
        pod:
          securityContext:
            # 启动脚本每次都会把 runtime-config.js 写进 /app/apps/web/.next/standalone/apps/web/public，
            # 该目录在镜像里属 root；非 root 跑不起来
            runAsUser: 0
            runAsGroup: 0
    service:
      app:
        controller: neko-master
        ports:
          http:
            port: 3000
            appProtocol: http
    persistence:
      # 统计库；不接 kopiur，单副本 longhorn-cache
      data:
        forceRename: *app
        type: persistentVolumeClaim
        storageClass: longhorn-cache
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /app/data
      # 复用 geoip-updater DaemonSet 落在每个节点的 MMDB
      geoip:
        type: hostPath
        hostPath: /data/envoy-geoip
        hostPathType: Directory
        globalMounts:
          - path: /app/data/geoip
            readOnly: true
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: internal
          gethomepage.dev/name: neko-master
          gethomepage.dev/app: *app
        hostnames: ["neko.${INTERNAL_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
