---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sb-sync-server
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-store
  target:
    name: sb-sync-server-secret
    template:
      engineVersion: v2
      data:
        SERVER_PRIVATE_KEY: "{{ .SB_SYNC_SERVER_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: sb-sync
