---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cpa-usage-keeper
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      cpa-usage-keeper:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/willxup/cpa-usage-keeper
              tag: v2.0.3@sha256:e56daad41fea07eff80045b0efb41f4c80f092ab3e87090a4089e0446cfe6855
            command: ["/app/cpa-usage-keeper"]
            env:
              TZ: ${TIMEZONE}
              WORK_DIR: /data
              CPA_BASE_URL: http://cli-proxy-api:8317
              REDIS_QUEUE_ADDR: cli-proxy-api:8317
              AUTH_ENABLED: "true"
              APP_BASE_PATH: /usage
              REDIS_QUEUE_IDLE_INTERVAL: 5s
              # 备份由 Kopiur 负责；应用自带每日备份会让 PVC 快照多出约 640 MB
              BACKUP_ENABLED: "false"
            envFrom:
              - secretRef:
                  name: cpa-usage-keeper-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: &port 8080
    persistence:
      data:
        existingClaim: cpa-usage-keeper
        advancedMounts:
          cpa-usage-keeper:
            app:
              - path: /data
