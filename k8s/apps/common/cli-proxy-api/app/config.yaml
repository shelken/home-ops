config-version: 8

server:
  # Server host/interface to bind to. Default is empty ("") to bind all interfaces (IPv4 + IPv6).
  # Use "127.0.0.1" or "localhost" to restrict access to local machine only.
  host: ""

  # Server port
  port: 8317

  # TLS settings for HTTPS. When enabled, the server listens with the provided certificate and key.
  tls:
    enable: false
    cert: ""
    key: ""

# Management API settings
management:
  # Whether to allow remote (non-localhost) management access.
  # When false, only localhost can access management endpoints (a key is still required).
  allow-remote: true

  # Management key. If a plaintext value is provided here, it will be hashed on startup.
  # All management requests (even from localhost) require this key.
  # Leave empty to disable the Management API entirely (404 for all /v0/management routes).
  secret-key: "{{ .MANAGEMENT_HASHED_PASSWORD }}"

  # Disable the bundled management control panel asset download and HTTP route when true.
  disable-control-panel: false

  # 面板版本由 helmrelease 的 seed-panel initContainer 固定种子; 关闭运行期定时更新,
  # 避免面板被自动替换成要求更高后端管理接口的版本 (文件缺失时首次访问仍会拉取最新版兜底)
  disable-auto-update-panel: true

  # GitHub repository for the management control panel. Accepts a repository URL or releases API URL.
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

# API keys for authentication
# openssl rand -base64 64 | tr -dc 'A-Za-z0-9' | head -c 32; echo
access:
  api-keys:
    - {{ .client_api_key_mio }}
    - {{ .client_api_key_alma }}
    - {{ .client_api_key_zed }}
    - {{ .client_api_key_phone17 }}

# Routing strategy for selecting credentials when multiple match.
routing:
  strategy: "fill-first" # round-robin (default), fill-first
  # 这个true的时候看起来换账号时缓存失效,free也一样,先关掉
  session-affinity: false

  # When true, unprefixed model requests only use credentials without a prefix (except when prefix == model name).
  # 强制模型前缀:主会话使用付费的前缀,subagent使用free
  force-model-prefix: false

  retry:
    # Number of times to retry a request. Retries will occur if the HTTP response code is 403, 408, 500, 502, 503, or 504.
    request-retry: 3

    # Maximum wait time in seconds for a cooled-down credential before triggering a retry.
    max-retry-interval: 30

requests:
  # Proxy URL. Supports socks5/http/https protocols. Example: socks5://user:pass@192.168.1.1:1080/
  # proxy-url: "socks5://sakamoto.lan:7890/"

  # When true, forward filtered upstream response headers to downstream clients.
  # Default is false (disabled).
  passthrough-headers: false

upstream:
  # xAI provider behavior.
  xai:
    # When true, inject the native x_search tool when the request does not declare it.
    # The injected tool is also added to tool_choice.allowed_tools when applicable.
    inject-x-search: true

# 上游 key 按分组声明: 一个 base-url + 共享设置 + keys 列表
api-keys:
  # Claude API keys
  claude:
    - name: deepseek
      base-url: "https://api.deepseek.com/anthropic"
      priority: 80
      models:
        - name: "deepseek-v4-flash"
          alias: "deepseek-v4-flash"
        - name: "deepseek-v4-pro"
          alias: "deepseek-v4-pro"
        - name: "deepseek-v4-flash"
          alias: "hindsight-retain"
        - name: "deepseek-v4-flash"
          alias: "hindsight-reflect"
        - name: "deepseek-v4-flash"
          alias: "hindsight-consolidation"
      keys:
        - api-key: {{ .DEEPSEEK_API_KEY_1 }}
          experimental-cch-signing: false
    - name: openrouter
      base-url: "https://openrouter.ai/api"
      priority: 100
      models:
        - name: "deepseek/deepseek-v4-flash:free"
          alias: "deepseek/deepseek-v4-flash:free"
        - name: "google/gemma-4-26b-a4b-it:free"
          alias: "google/gemma-4-26b-a4b-it:free"
        - name: "google/gemma-4-31b-it:free"
          alias: "google/gemma-4-31b-it:free"
        - name: "openai/gpt-oss-120b:free"
          alias: "openai/gpt-oss-120b:free"
        - name: "openai/gpt-oss-20b:free"
          alias: "openai/gpt-oss-20b:free"
        - name: "minimax/minimax-m2.5:free"
          alias: "minimax/minimax-m2.5:free"
        - name: "inclusionai/ring-2.6-1t:free"
          alias: "inclusionai/ring-2.6-1t:free"
        - name: "openai/gpt-oss-20b:free"
          alias: "hindsight-retain"
        - name: "openai/gpt-oss-120b:free"
          alias: "hindsight-reflect"
        - name: "openai/gpt-oss-20b:free"
          alias: "hindsight-consolidation"
      keys:
        - api-key: {{ .OPENROUTER_API_KEY_1 }}
        - api-key: {{ .OPENROUTER_API_KEY_2 }}
        - api-key: {{ .OPENROUTER_API_KEY_3 }}
        - api-key: {{ .OPENROUTER_API_KEY_4 }}
        - api-key: {{ .OPENROUTER_API_KEY_5 }}
        - api-key: {{ .OPENROUTER_API_KEY_6 }}
        - api-key: {{ .OPENROUTER_API_KEY_7 }}
        - api-key: {{ .OPENROUTER_API_KEY_8 }}

  # OpenAI compatibility providers
  # priority 越大越优先
  openai-compatibility:
    - name: "groq"
      priority: 100
      base-url: "https://api.groq.com/openai/v1"
      models:
        - name: "openai/gpt-oss-120b"
          alias: "openai/gpt-oss-120b:free"
        - name: "openai/gpt-oss-20b"
          alias: "openai/gpt-oss-20b:free"
        - name: "openai/gpt-oss-20b"
          alias: "hindsight-retain"
        - name: "openai/gpt-oss-120b"
          alias: "hindsight-reflect"
        - name: "openai/gpt-oss-20b"
          alias: "hindsight-consolidation"
      keys:
        - api-key: {{ .GROQ_API_KEY_1 }}
    - name: "wx"
      priority: 100
      base-url: "https://chatapi.weixin.qq.com/openai/v1"
      models:
        - name: "GLM-5.2"
        - name: "Deepseek-v4-flash"
      keys:
        - api-key: {{ .WX_API_KEY_1 }}
    # - name: "lm-studio"
    #   base-url: "http://sakamoto.lan:1234/v1"
    #   models:
    #     - name: "qwen3-4b"
    #       alias: "qwen3-4b"

oauth:
  # Authentication directory (supports ~ for home directory)
  auth-dir: "~/.cli-proxy-api"

  providers:
    aistudio:
      # When true, enable authentication for the WebSocket API (/v1/ws).
      ws-auth: true

    # 上游 WAF 命中敏感词即回假 429 RESOURCE_EXHAUSTED。
    # 用字面替换而非 sensitive-words 混淆: 上游仍可能识别被混淆的词
    # https://github.com/router-for-me/CLIProxyAPI/issues/7552
    antigravity:
      sensitive-words-replace:
        # oh-my-pi 标签与 RFC 2119 短语 https://github.com/can1357/oh-my-pi/issues/11699
        "system-conventions": "conventions"
        "system_conventions": "conventions"
        "system-directive": "directive"
        "system_directive": "directive"
        "RFC 2119": ""
        # pi 系统提示的身份句: 实测只有 "running inside pi" 触发, 加 "the" 即可通过
        "running inside pi": "running inside the pi"
        # pi 系统提示里的 docs 段
        "codemode scripts and non-LLM models such as classifiers and image models": "codemode scripts and other tooling"

multimedia:
  # (可能)如果不同类型订阅,会因为tools不同导致缓存失效,plus等会加,free不加之后导致auth切换时失效
  disable-image-generation: chat

observability:
  logs:
    # Enable debug logging
    debug: true

    request-log: false

    # When true, write application logs to rotating files instead of stdout
    logging-to-file: false

    # Maximum total size (MB) of log files under the logs directory. When exceeded, the oldest log
    # files are deleted until within the limit. Set to 0 to disable.
    logs-max-total-size-mb: 0

  usage:
    # When false, disable in-memory usage statistics aggregation
    usage-statistics-enabled: true

plugins:
  enabled: true
  configs:
    # 版本跟插件各自的 Release: external 声明指向的上游仓, 本仓多插件仓则用 extractVersion 从 <id>/vX.Y.Z 标签里取版本
    cpa-codex-autoban:
      enabled: true
      priority: 100
      store:
        # renovate: datasource=github-releases depName=shelken/cpa-codex-autoban
        version: 0.2.4
        source-url: https://raw.githubusercontent.com/shelken/cpa-plugins/main/registry.json
    qwenworkcn:
      enabled: true
      store:
        # renovate: datasource=github-releases depName=shelken/cpa-plugins extractVersion=^qwenworkcn/v(?<version>.+)$
        version: 0.1.8
        source-url: https://raw.githubusercontent.com/shelken/cpa-plugins/main/registry.json
    workbuddy:
      enabled: true
      store:
        # renovate: datasource=github-releases depName=shelken/cpa-plugins extractVersion=^workbuddy/v(?<version>.+)$
        version: 0.4.3
        source-url: https://raw.githubusercontent.com/shelken/cpa-plugins/main/registry.json
  store-sources:
    - https://raw.githubusercontent.com/shelken/cpa-plugins/main/registry.json

