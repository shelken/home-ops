---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cli-proxy-api
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      cli-proxy-api:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          copy-config:
            image: &image
              repository: eceasy/cli-proxy-api
              tag: v8.0.80@sha256:0695ae8721d623ed31179369fc7127d469f10a14a37a49c366e82a16383662f8
            command: ["sh", "-c", "cp /secret-config/config.yaml /config/config.yaml"]
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
          # 管理面板跟随上游最新 Release, 新版本可能要求更高的后端管理接口 (v1.25.0 起强制 v8);
          # 固定种子版本 + config.yaml disable-auto-update-panel, 面板版本与后端镜像经 renovate 分组联动升级
          seed-panel:
            image: &curl-image
              repository: docker.io/curlimages/curl
              tag: 8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
            command:
              - sh
              - -c
              # renovate: datasource=github-releases depName=router-for-me/Cli-Proxy-API-Management-Center
              - curl -fsSL --retry 3 -o /CLIProxyAPI/management/management.html https://github.com/router-for-me/Cli-Proxy-API-Management-Center/releases/download/v1.28.3/management.html || echo 'seed-panel download failed, panel falls back to latest on first access'
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
          fetch-models:
            image: *curl-image
            command:
              - sh
              - -c
              - (curl -fsSL --retry 3 -o /CLIProxyAPI/catalog/models.json.tmp https://models.router-for.me/models.json || curl -fsSL --retry 3 -o /CLIProxyAPI/catalog/models.json.tmp https://raw.githubusercontent.com/router-for-me/models/refs/heads/main/models.json) && mv /CLIProxyAPI/catalog/models.json.tmp /CLIProxyAPI/catalog/models.json || rm -f /CLIProxyAPI/catalog/models.json.tmp
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
          sync-models:
            dependsOn: fetch-models
            image:
              repository: docker.io/mikefarah/yq
              tag: 4.54.3@sha256:7834187596ad56fd5a81436114e0b0b9dd54c91bb43946d1f7145b2be5f9c3d2
            args:
              - eval-all
              - -i
              - -o=json
              - "select(fileIndex == 0) *+ select(fileIndex == 1) | .antigravity |= unique_by(.id)"
              - /CLIProxyAPI/catalog/models.json
              - /scripts/models-extra.json
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
        containers:
          app:
            image: *image
            command: ["/CLIProxyAPI/CLIProxyAPI"]
            args: ["--config", "/config/config.yaml"]
            env:
              TZ: ${TIMEZONE}
              MANAGEMENT_STATIC_PATH: &management /CLIProxyAPI/management
              MANAGEMENT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: cli-proxy-api-secret
                    key: MANAGEMENT_PASSWORD
            lifecycle:
              postStart:
                exec:
                  command: ["/scripts/plugin-sync.pl"]
            # 注释为了不想在日志中出现大量这个接口
            # probes:
            #   liveness: &probes
            #     enabled: true
            #     custom: true
            #     spec:
            #       httpGet:
            #         path: /healthz
            #         port: &port 8317
            #       initialDelaySeconds: 0
            #       periodSeconds: 10
            #       timeoutSeconds: 1
            #       failureThreshold: 10
            #   readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      # GPU worker 重装期间不可用，固定在 arm64 节点
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.69.60
        externalTrafficPolicy: Local
        ports:
          api:
            port: &port 8317
          gemini:
            port: 8085
          codex:
            port: 1455
          # anthropic:
            # port: 54545
          ## ./CLIProxyAPI --antigravity-login --no-browser
          antigravity:
            port: 51121
          # iflow:
          #   port: 11451
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: internal
          gethomepage.dev/name: *app
          gethomepage.dev/app: *app
          gethomepage.dev/icon: kubernetes-dashboard.svg
        hostnames: ["cpa.${INTERNAL_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
          # - &for-pi-websocket
          #   matches:
          #     - path:
          #         type: Exact
          #         value: /v1/codex/responses
          #   filters:
          #     - type: URLRewrite
          #       urlRewrite:
          #         path:
          #           type: ReplaceFullPath
          #           replaceFullPath: /v1/responses
          #   backendRefs:
          #     - name: app
          #       port: *port
          - matches:
              - path:
                  type: PathPrefix
                  value: /usage
            backendRefs:
              - name: cpa-usage-keeper
                port: 8080
      # app-external:
      #   annotations:
      #     gethomepage.dev/enabled: "true"
      #     gethomepage.dev/group: external
      #     gethomepage.dev/name: *app
      #     gethomepage.dev/icon: kubernetes-dashboard.svg
      #     gethomepage.dev/app: *app
      #     gatus.home-operations.com/endpoint: |-
      #       conditions:
      #         - "[STATUS] == 404"
      #   hostnames: ["cpa.${MAIN_DOMAIN}"]
      #   parentRefs:
      #     - name: envoy-external
      #       namespace: network
      #   rules:
      #     # - <<: *for-pi-websocket
      #     - matches:
      #         - path:
      #             type: PathPrefix
      #             value: /v1
      #       backendRefs:
      #         - identifier: app
      #           port: *port
    persistence:
      scripts:
        type: configMap
        name: cli-proxy-api-scripts
        defaultMode: 0755
        advancedMounts:
          cli-proxy-api:
            app:
              - path: /scripts
                readOnly: true
            sync-models:
              - path: /scripts
                readOnly: true
      auths:
        existingClaim: cli-proxy-api
        advancedMounts:
          cli-proxy-api:
            app:
              - path: /root/.cli-proxy-api
                subPath: auths
              - path: /.cli-proxy-api
                subPath: for-run
              - path: /CLIProxyAPI/plugins
                subPath: plugins
              - path: /CLIProxyAPI/catalog
                subPath: catalog
                readOnly: true
            fetch-models:
              - path: /CLIProxyAPI/catalog
                subPath: catalog
            sync-models:
              - path: /CLIProxyAPI/catalog
                subPath: catalog
      config-file:
        type: secret
        name: cli-proxy-api-secret
        advancedMounts:
          cli-proxy-api:
            copy-config:
              - path: /secret-config/config.yaml
                subPath: config.yaml
                readOnly: true
      config-rw:
        type: emptyDir
        advancedMounts:
          cli-proxy-api:
            copy-config:
              - path: /config
            app:
              - path: /config

      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /CLIProxyAPI/logs
            subPath: logs
          - path: *management
            subPath: management
