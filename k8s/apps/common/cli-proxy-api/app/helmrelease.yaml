---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cli-proxy-api
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      cli-proxy-api:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          copy-config:
            image: &image
              repository: eceasy/cli-proxy-api
              tag: v8.0.4@sha256:72205ea2dff7e3e3ef23b03de4e17b169ff7449c02b12f2924a3d4d3eee68b7d
            command: ["sh", "-c", "cp /secret-config/config.yaml /config/config.yaml"]
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
          # 管理面板跟随上游最新 Release, 新版本可能要求更高的后端管理接口 (v1.25.0 起强制 v8);
          # 固定种子版本 + config.yaml disable-auto-update-panel, 面板版本与后端镜像经 renovate 分组联动升级
          seed-panel:
            image:
              repository: docker.io/curlimages/curl
              tag: 8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
            command:
              - sh
              - -c
              # renovate: datasource=github-releases depName=router-for-me/Cli-Proxy-API-Management-Center
              - curl -fsSL --retry 3 -o /CLIProxyAPI/management/management.html https://github.com/router-for-me/Cli-Proxy-API-Management-Center/releases/download/v1.25.0/management.html || echo 'seed-panel download failed, panel falls back to latest on first access'
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
        containers:
          app:
            image: *image
            command: ["/CLIProxyAPI/CLIProxyAPI"]
            args: ["--config", "/config/config.yaml"]
            env:
              TZ: ${TIMEZONE}
              MANAGEMENT_STATIC_PATH: &management /CLIProxyAPI/management
              MANAGEMENT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: cli-proxy-api-secret
                    key: MANAGEMENT_PASSWORD
            lifecycle:
              postStart:
                exec:
                  command: ["/scripts/plugin-sync.pl"]
            # 注释为了不想在日志中出现大量这个接口
            # probes:
            #   liveness: &probes
            #     enabled: true
            #     custom: true
            #     spec:
            #       httpGet:
            #         path: /healthz
            #         port: &port 8317
            #       initialDelaySeconds: 0
            #       periodSeconds: 10
            #       timeoutSeconds: 1
            #       failureThreshold: 10
            #   readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.69.60
        externalTrafficPolicy: Local
        ports:
          api:
            port: &port 8317
          gemini:
            port: 8085
          codex:
            port: 1455
          # anthropic:
            # port: 54545
          ## ./CLIProxyAPI --antigravity-login --no-browser
          antigravity:
            port: 51121
          # iflow:
          #   port: 11451
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: internal
          gethomepage.dev/name: *app
          gethomepage.dev/app: *app
          gethomepage.dev/icon: kubernetes-dashboard.svg
        hostnames: ["cpa.${INTERNAL_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
          # - &for-pi-websocket
          #   matches:
          #     - path:
          #         type: Exact
          #         value: /v1/codex/responses
          #   filters:
          #     - type: URLRewrite
          #       urlRewrite:
          #         path:
          #           type: ReplaceFullPath
          #           replaceFullPath: /v1/responses
          #   backendRefs:
          #     - name: app
          #       port: *port
          - matches:
              - path:
                  type: PathPrefix
                  value: /usage
            backendRefs:
              - name: cpa-usage-keeper
                port: 8080
      app-external:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: external
          gethomepage.dev/name: *app
          gethomepage.dev/icon: kubernetes-dashboard.svg
          gethomepage.dev/app: *app
          gatus.home-operations.com/endpoint: |-
            conditions:
              - "[STATUS] == 404"
        hostnames: ["cpa.${MAIN_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https-cpa
        rules:
          # - <<: *for-pi-websocket
          - matches:
              - path:
                  type: PathPrefix
                  value: /v1
            backendRefs:
              - identifier: app
                port: *port
    persistence:
      scripts:
        type: configMap
        name: cli-proxy-api-scripts
        defaultMode: 0755
        advancedMounts:
          cli-proxy-api:
            app:
              - path: /scripts
                readOnly: true
      auths:
        existingClaim: cli-proxy-api
        advancedMounts:
          cli-proxy-api:
            app:
              - path: /root/.cli-proxy-api
                subPath: auths
              - path: /.cli-proxy-api
                subPath: for-run
              - path: /CLIProxyAPI/plugins
                subPath: plugins
      config-file:
        type: secret
        name: cli-proxy-api-secret
        advancedMounts:
          cli-proxy-api:
            copy-config:
              - path: /secret-config/config.yaml
                subPath: config.yaml
                readOnly: true
      config-rw:
        type: emptyDir
        advancedMounts:
          cli-proxy-api:
            copy-config:
              - path: /config
            app:
              - path: /config

      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /CLIProxyAPI/logs
            subPath: logs
          - path: *management
            subPath: management
