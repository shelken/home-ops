---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app jellyfin
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.ooooo.space/need-smb: "true"
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/keda/smb-scaler
  dependsOn:
    - name: kopiur-repository
      namespace: kopiur-system
    - name: smb-volumes
    - name: keda
      namespace: observability
    - name: csi-driver-smb
      namespace: storage
  interval: 1h
  path: ./k8s/apps/common/jellyfin/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_CACHE_CAPACITY: 10Gi
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
