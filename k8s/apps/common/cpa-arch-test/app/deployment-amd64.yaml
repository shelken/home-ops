---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpa-amd64
  labels:
    app.kubernetes.io/name: cpa-arch-test
    app.kubernetes.io/variant: amd64
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cpa-arch-test
      app.kubernetes.io/variant: amd64
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpa-arch-test
        app.kubernetes.io/variant: amd64
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: install-workbuddy
          image: docker.io/curlimages/curl:8.23.0@sha256:11e64e28c5f58c8d93ee95fcf22ac055f48b0bc440e0ce7d8013bbb5ad6aa8ac
          command: [sh, -ceu]
          args:
            - |
              curl -fsSL --retry 3 -o /tmp/workbuddy.zip 'https://github.com/shelken/cpa-plugins/releases/download/workbuddy%2Fv0.4.0/workbuddy_0.4.0_linux_amd64.zip'
              echo 'c0716fc6169c0d56d9b9304a46cd8c999b3068a353957ecd3cec09cf0393a9e9  /tmp/workbuddy.zip' | sha256sum -c -
              mkdir -p /plugins/linux/amd64
              unzip -p /tmp/workbuddy.zip workbuddy.so > /plugins/linux/amd64/workbuddy-v0.4.0.so
              chmod 0555 /plugins/linux/amd64/workbuddy-v0.4.0.so
          volumeMounts:
            - name: plugins
              mountPath: /plugins
      containers:
        - name: app
          image: eceasy/cli-proxy-api:v8.0.36@sha256:bc25ea627f675e4e3714f48d3b1dd22643e45464dcc1c3c7c5688f51bc6b49fb
          command: [/CLIProxyAPI/CLIProxyAPI]
          args: [--config, /config/config.yaml]
          ports:
            - name: http
              containerPort: 8317
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: auth
              mountPath: /auth
            - name: plugins
              mountPath: /plugins
            - name: runtime
              mountPath: /CLIProxyAPI/logs
              subPath: logs
            - name: runtime
              mountPath: /CLIProxyAPI/management
              subPath: management
      volumes:
        - name: config
          configMap:
            name: cpa-arch-test-config
        - name: auth
          emptyDir: {}
        - name: plugins
          emptyDir: {}
        - name: runtime
          emptyDir: {}
