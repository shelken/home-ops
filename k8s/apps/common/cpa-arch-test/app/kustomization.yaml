apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment-amd64.yaml
  - deployment-arm64.yaml
  - services.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: cpa-arch-test-config
    files:
      - config.yaml=./config.yaml
