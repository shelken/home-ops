---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security
components:
  - ../../../components/common
resources:
  - authelia/ks.yaml
  - crowdsec/ks.yaml
  - pocket-id/ks.yaml

patches:
  - target:
      kind: Namespace
    patch: |-
      - op: add
        path: /metadata/annotations/kopiur.home-operations.com~1privileged-movers
        value: "true"
