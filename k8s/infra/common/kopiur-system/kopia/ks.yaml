---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kopia
  namespace: &namespace kopiur-system
spec:
  components:
    - ../../../../../components/authelia
  postBuild:
    substitute:
      APP: *app
  interval: 1h
  dependsOn:
    - name: kopiur
      namespace: *namespace
    - name: kopiur-repository
      namespace: *namespace
  path: ./k8s/infra/common/kopiur-system/kopia/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kopia-cloud
  namespace: &namespace kopiur-system
spec:
  components:
    - ../../../../../components/authelia
  postBuild:
    substitute:
      APP: *app
  dependsOn:
    - name: kopiur
      namespace: *namespace
    - name: kopiur-repository-cloud
      namespace: *namespace
  interval: 1h
  path: ./k8s/infra/common/kopiur-system/kopia/cloud
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
