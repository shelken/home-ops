---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopia-cloud
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-store
  target:
    name: kopia-cloud-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        OPENLIST_WEBDAV_USERNAME: "{{ .OPENLIST_WEBDAV_USERNAME }}"
        OPENLIST_WEBDAV_PASSWORD: "{{ .OPENLIST_WEBDAV_PASSWORD }}"
        repository.config: |
          {
            "storage": {
              "type": "webdav",
              "config": {
                "url": "http://openlist.default.svc.cluster.local:80/dav/kopiur",
                "username": "{{ .OPENLIST_WEBDAV_USERNAME }}",
                "password": "{{ .OPENLIST_WEBDAV_PASSWORD }}"
              }
            },
            "hostname": "kopiur",
            "username": "kopiur",
            "description": "Cloud Repository in WebDAV (139 kopiur)",
            "enableActions": false
          }
  dataFrom:
    - extract:
        key: volsync-template
