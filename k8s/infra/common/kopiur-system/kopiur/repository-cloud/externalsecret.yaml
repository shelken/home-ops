---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-repository-cloud
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-store
  target:
    name: kopiur-repository-cloud-secret
    creationPolicy: Owner
    template:
      data:
        # rclone.conf 的 pass 须为 rclone obscure 值，模板算不出；改用 Basic 头认证
        KOPIA_RCLONE_CONFIG: |
          [openlist]
          type = webdav
          url = http://openlist.default.svc.cluster.local:80/dav/kopiur
          vendor = other
          headers = Authorization,Basic {{ printf "%s:%s" .OPENLIST_WEBDAV_USERNAME .OPENLIST_WEBDAV_PASSWORD | b64enc }}
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
  dataFrom:
    - extract:
        key: kopiur
