---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-repository-cloud
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-store
  target:
    name: kopiur-repository-cloud-secret
    creationPolicy: Owner
    template:
      data:
        KOPIA_WEBDAV_USERNAME: "{{ .OPENLIST_WEBDAV_USERNAME }}"
        KOPIA_WEBDAV_PASSWORD: "{{ .OPENLIST_WEBDAV_PASSWORD }}"
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
  dataFrom:
    - extract:
        key: volsync-template
