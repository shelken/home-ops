---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# 云端仓库凭据：S3 密钥复用宿主机 Kopia 的 OpenList 凭据，仓库口令复用 volsync-template，
# 与本地 sakamoto 仓库并列但完全独立初始化，不复用其仓库格式。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-cloud
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-store
  target:
    name: kopiur-cloud-secret
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: compose-sakamoto
        property: OPENLIST_S3_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: compose-sakamoto
        property: OPENLIST_S3_SECRET_ACCESS_KEY
    - secretKey: KOPIA_PASSWORD
      remoteRef:
        key: volsync-template
        property: KOPIA_PASSWORD
