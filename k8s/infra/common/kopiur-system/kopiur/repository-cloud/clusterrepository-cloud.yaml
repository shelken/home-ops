---
# yaml-language-server: $schema=https://raw.githubusercontent.com/home-operations/kopiur/main/deploy/crds/clusterrepositories.yaml
# 云端仓库：每天一次直接写入集群内 OpenList 的 S3，替代宿主机 Kopia 对 MinIO kopiur 桶的二次封装。
# 本地仓库每小时一次，产生的小 pack 在维护合并时重写；云端只收每日快照，日常上传量只有净增量
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: cloud-openlist
spec:
  allowedNamespaces:
    all: true
  # 首次建库曾在默认 120s 内超时并留下空的 kopiur 目录。OpenList 把空目录列为占位对象，
  # kopia 随后视其为已有数据而拒绝建库，需先手工删除该目录
  bootstrap:
    failurePolicy:
      activeDeadlineSeconds: 600
  # 所有应用的云端调度集中在凌晨，允许少量并行，单个慢上传不阻塞其余应用
  concurrency:
    maxConcurrentJobs: 1
  credentialProjection:
    allowed: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-cloud-secret
          namespace: kopiur-system
      # 与宿主机 Kopia 共用 kopia 桶，用前缀隔离两套仓库。
      # 集群内部直连 OpenList Service 端口 5246（明文 S3），不经 Envoy 与外部 DNS。
      bucket: kopia
      prefix: kopiur/
      endpoint: openlist.default.svc.cluster.local:5246
      tls:
        disableTls: true
  encryption:
    passwordSecretRef:
      name: kopiur-cloud-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  maintenance:
    failurePolicy:
      activeDeadlineSeconds: 1800 # 最多 30 分钟，卡死强制 kill
    # 云端每天只写一次，quick 维护无需每小时跑；full 每周一次即可回收旧包。
    schedule:
      quick:
        cron: 0 5 * * *
        jitter: 10m
      full:
        cron: 0 5 * * 0
        jitter: 1h
  moverDefaults:
    cache:
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 1024
  scheduleDefaults:
    timezone: ${TIMEZONE}
