# yaml-language-server: $schema=https://raw.githubusercontent.com/home-operations/kopiur/main/deploy/crds/clusterrepositories.yaml
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: yun139
spec:
  allowedNamespaces:
    all: true
  mode: ReadWrite
  bootstrap:
    failurePolicy:
      activeDeadlineSeconds: 660
  concurrency:
    maxConcurrentJobs: 1
  credentialProjection:
    allowed: true
  backend:
    # rclone 后端默认 atomicWrites：直接 PUT 最终名，绕开 openlist→139 改名静默失败（#1763）
    rclone:
      remotePath: "openlist:"
      startupTimeout: 2m
      configSecretRef:
        name: kopiur-repository-cloud-secret
        namespace: kopiur-system
  encryption:
    passwordSecretRef:
      name: kopiur-repository-cloud-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  maintenance:
    enabled: true
    failurePolicy:
      activeDeadlineSeconds: 1800
    schedule:
      quick:
        cron: 0 5 * * *
        jitter: 10m
      full:
        cron: 0 5 * * 0
        jitter: 1h
  moverDefaults:
    cache:
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 1024
  scheduleDefaults:
    timezone: ${TIMEZONE}
