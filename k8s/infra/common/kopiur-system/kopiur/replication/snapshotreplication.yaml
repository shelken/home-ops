---
# yaml-language-server: $schema=https://raw.githubusercontent.com/home-operations/kopiur/main/deploy/crds/snapshotreplications.yaml
# 云端副本改为集中复制：应用侧不再直写 cloud 仓库（已移除各应用的 ${APP}-cloud 策略）。
# 复制把本地仓库每个身份的最新快照搬到云端，天然每天一份，省掉每个应用一次的卷快照与克隆。
# 时区不写死：复制调度的优先级是 spec.schedule.timezone → 源仓库 scheduleDefaults.timezone
# （sakamoto 已设）→ UTC，因此 cron 仍按本地时钟在低峰 04:15 触发。
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotReplication
metadata:
  name: sakamoto-to-cloud
  namespace: kopiur-system
spec:
  # 首次复制前须在 yun139 设置全局 zstd 策略，再通过 Git 解除暂停。
  suspend: true
  sourceRef:
    kind: ClusterRepository
    name: sakamoto
  destinationRef:
    kind: ClusterRepository
    name: yun139
  schedule:
    cron: "15 4 * * *"
    jitter: 10m
  selection:
    latestOnly: true
  migrate:
    parallel: 1
    policies: none
    throttle:
      destination:
        uploadBytesPerSecond: 3145728
  pruning:
    retention:
      keepDaily: 7
      keepWeekly: 4
  credentialProjection:
    enabled: true
