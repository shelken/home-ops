---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  chartRef:
    kind: OCIRepository
    name: longhorn
  interval: 5m
  timeout: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # ref: https://github.com/longhorn/charts/blob/v1.10.x/charts/longhorn/values.yaml
    # ref: https://github.com/blackjid/home-ops/blob/236881774e9e0fe48266db255d61ca220e64af5f/kubernetes/apps/longhorn-system/longhorn/app/helmrelease.yaml
    csi:
      attacherReplicaCount: 2
      provisionerReplicaCount: 2
      resizerReplicaCount: 2
      snapshotterReplicaCount: 2
    persistence:
      defaultClassReplicaCount: 2 # 副本数量
      defaultDataLocality: best-effort # 副本倾向放在pod所在位置
    defaultSettings:
      defaultDataLocality: best-effort
      defaultDataPath: /mnt/lima-longhorn # 默认是 /var/lib/longhorn
      defaultReplicaCount: "1"
      # 串行升级 Volume Engine，限制升级期间的额外 CPU、内存和 InstanceManager 开销。
      # attached 卷完成 live upgrade 后仍需在维护窗口 detach 一次，旧 InstanceManager 才能自动回收。
      concurrentAutomaticEngineUpgradePerNodeLimit: "1"
      # 保留 instance-manager 的运行保障；历史峰值表明不应为消除容量告警继续下调。
      guaranteedInstanceManagerCPU: '{"v1":"8","v2":"8"}'
      # orphan replica data 不是业务状态，保留 5 分钟用于误判缓冲，之后由 Longhorn 自动清理。
      orphanResourceAutoDeletion: replica-data
      orphanResourceAutoDeletionGracePeriod: "300"
      # nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
      # replicaAutoBalance: best-effort # 默认disabled
      storageMinimalAvailablePercentage: "5" # 默认 25
      storageReservedPercentageForDefaultDisk: "10" # longhorn用90%
      # taintToleration: "node-role.kubernetes.io/control-plane=Exists:NoSchedule" # 让longhorn-manager等daemonset能够正常调度到控制平面
    longhornUI:
      replicas: 1
    metrics:
      serviceMonitor:
        enabled: true
    image:
      longhorn:
        engine:
          registry: &registry "mirror.gcr.io"
        manager:
          registry: *registry
        ui:
          registry: *registry
        instanceManager:
          registry: *registry
        shareManager:
          registry: *registry
        backingImageManager:
          registry: *registry
        supportBundleKit:
          registry: *registry
