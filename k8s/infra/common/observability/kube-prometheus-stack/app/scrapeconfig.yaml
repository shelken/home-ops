---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name caddy-sakamoto
spec:
  staticConfigs:
    - targets:
        - sakamoto.lan:2019
      labels:
        job: *name
  metricsPath: /metrics
  scrapeInterval: 30s

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/scrapeconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: &name caddy-vps-cc
spec:
  staticConfigs:
    - targets:
        - ts-node-vps.network.svc:2019
      labels:
        job: *name
  metricsPath: /metrics
  scrapeInterval: 60s

