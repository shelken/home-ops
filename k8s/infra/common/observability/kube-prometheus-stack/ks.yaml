---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kube-prometheus-stack
  namespace: &namespace observability
spec:
  # Prometheus 与 Alertmanager 不做认证；组件只指向一条路由，第二条用补丁追加
  components:
    - ../../../../../components/authelia
  postBuild:
    substitute:
      APP: *app
      AUTHELIA_ROUTE: kube-prometheus-stack-prometheus
  patches:
    - patch: |-
        - op: add
          path: /spec/targetRefs/-
          value:
            group: gateway.networking.k8s.io
            kind: HTTPRoute
            name: kube-prometheus-stack-alertmanager
      # 补丁在变量替换前执行，此时名字还是 ${APP}，只能按类型匹配
      target:
        group: gateway.envoyproxy.io
        kind: SecurityPolicy
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
    - name: bitwarden-store
      namespace: external-secrets
  interval: 1h
  path: ./k8s/infra/common/observability/kube-prometheus-stack/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
