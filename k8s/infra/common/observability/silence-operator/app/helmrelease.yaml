---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: silence-operator
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.21.0
  url: oci://gsoci.azurecr.io/charts/giantswarm/silence-operator
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: silence-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: silence-operator
  values:
    alertmanagerAddress: http://alertmanager-operated.observability.svc.cluster.local:9093
    networkPolicy:
      enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
    # 上游 Giantswarm 0.21.0 OCI index 虽然声明了 arm64，但其构建 Makefile.gen.go.mk 存在缺陷，
    # 容器内部打包的实际二进制依然是 x86-64 (amd64)，在 arm64 节点执行报 exec format error。
    # 官方 Issue #497 仍为 OPEN 状态。在此缺陷修复前，必须锁定仅调度至 amd64 节点。
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values: ["amd64"]
