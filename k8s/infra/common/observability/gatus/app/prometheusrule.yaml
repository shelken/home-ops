---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gatus-rules
spec:
  groups:
    - name: gatus.rules
      rules:
        - alert: Gatus|外部服务无法访问
          expr: |
            gatus_results_endpoint_success{group="external"} == 0
          for: 1m
          annotations:
            summary: >-
              外部入口 {{ $labels.name }} 无法访问({{ $labels.type }})
            description: >-
              external 分组失败通常位于公网 DNS/VPS Caddy/Envoy Gateway/GeoIP RBAC 链路，先查 Victoria Logs 中对应 Envoy access log 的 response_code_details。
          labels:
            severity: critical

        - alert: Gatus|内部服务暴露
          expr: |
            gatus_results_endpoint_success{group=~"internal"} == 0
          for: 5m
          annotations:
            summary: >-
              内部服务 {{ $labels.name }} 从公共DNS查询到了
          labels:
            severity: critical

        - alert: Gatus|Sakamoto 服务
          expr: |
            gatus_results_endpoint_success{group=~"sakamoto"} == 0
          for: 5m
          annotations:
            summary: >-
              Sakamoto 的 {{ $labels.name }} 连接({{ $labels.type }})失败
          labels:
            severity: critical

        - alert: Gatus|设备检测
          expr: |
            gatus_results_endpoint_success{group=~"device"} == 0
          for: 5m
          annotations:
            summary: >-
              物理设备 {{ $labels.name }} 连接({{ $labels.type }})失败
          labels:
            severity: critical

        - alert: Gatus|基础服务连接失败
          expr: |
            gatus_results_endpoint_success{group=~"services"} == 0
          for: 5m
          annotations:
            summary: >-
              基础服务 {{ $labels.name }} 连接({{ $labels.type }})失败
          labels:
            severity: critical

        - alert: Gatus|镜像端点失效
          expr: |
            gatus_results_endpoint_success{group="registry-mirror"} == 0
          for: 1h
          annotations:
            summary: >-
              镜像端点 {{ $labels.name }} 域名解析失败
            description: >-
              containerd 会回退到下一个镜像端点或源站，不会立即故障；确认域名已失效后从 ansible/playbooks/resource/registries.yaml 删除该端点。
          labels:
            severity: warning
