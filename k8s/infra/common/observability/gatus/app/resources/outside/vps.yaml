---
endpoints:
  - &common
    name: derp
    group: vps
    url: https://derp.${MAIN_DOMAIN}
    interval: 2m
    ui:
      hide-hostname: true
      hide-url: true
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
  - <<: *common
    name: vps-caddy
    url: "tcp://ts-node-vps.network.svc:443"
    interval: 2m
    conditions:
      - "[CONNECTED] == true"
    ui: {}
  - name: mosdns
    group: vps
    url: ts-node-vps.network.svc:5054
    interval: 2m
    dns:
      query-name: openai.com
      query-type: A
    ui:
      hide-hostname: true
      hide-url: true
      hide-conditions: true
    conditions:
      - "[CONNECTED] == true"
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == pat(*.*.*.*)"
    alerts:
      - type: custom
  - <<: *common
    name: openlist
    url: http://ts-node-vps.network.svc:5244/api/public/settings
    method: HEAD
  - <<: *common
    name: kopia
    url: http://ts-node-vps.network.svc:51515/
    method: HEAD
  - <<: *common
    name: vps-node-exporter
    url: "tcp://ts-node-vps.network.svc:9100"
    conditions:
      - "[CONNECTED] == true"
  - <<: *common
    name: anytls
    url: "tcp://ts-node-vps.network.svc:5444" # 探真实入口，比原来数进程准
    conditions:
      - "[CONNECTED] == true"
  # hysteria2 是纯 UDP 入站，Gatus 没有 UDP 探针；原来那条只能靠 docker API 数进程。
  # 换掉 docker API 后从集群侧没有等价探针：要么不再监控它，要么让 VPS 自己把单元状态
  # 上报到 Gatus 的 external/push 检查。
  - name: dnsmasq
    group: vps
    url: ts-node-vps.network.svc:5353
    interval: 2m
    dns:
      query-name: example.com # 走它自己的上游，与集群状态解耦
      query-type: A
    ui:
      hide-hostname: true
      hide-url: true
    conditions:
      - "[CONNECTED] == true"
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == pat(*.*.*.*)"
    alerts:
      - type: custom
  - <<: *common
    name: dhp
    url: https://dhp.${MAIN_DOMAIN}/v2/
    method: HEAD
