---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: keda
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 2.20.2
  url: oci://ghcr.io/home-operations/charts-mirror/keda
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
spec:
  interval: 1h
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: keda
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    enableServiceLinks: false
    resources:
      operator:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 384Mi
      metricServer:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi
      webhooks:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
