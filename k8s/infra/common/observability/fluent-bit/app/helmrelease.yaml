---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
spec:
  chartRef:
    kind: OCIRepository
    name: fluent-bit
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    #ref: https://github.com/fluent/helm-charts/blob/main/charts/fluent-bit/values.yaml
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
    image:
      repository: ghcr.io/fluent/fluent-bit
    # chart 只渲染 classic ini，配置文件改用 YAML 需自行指定文件名
    args:
      - --workdir=/fluent-bit/etc
      - --config=/fluent-bit/etc/conf/fluent-bit.yaml
    config:
      extraFiles:
        fluent-bit.yaml: |-
          service:
            daemon: off
            flush: {{ .Values.flush }}
            log_level: {{ .Values.logLevel }}
            http_server: on
            http_listen: 0.0.0.0
            http_port: {{ .Values.metricsPort }}
            health_check: on
          pipeline:
            inputs:
              - name: tail
                alias: kubernetes
                path: /var/log/containers/*.log
                parser: containerd
                tag: kubernetes.*
                skip_empty_lines: on
                skip_long_lines: on
            filters:
              - name: kubernetes
                match: kubernetes.*
                merge_log: on
                kube_tag_prefix: kubernetes.var.log.containers.
                "k8s-logging.parser": on
                "k8s-logging.exclude": on
                namespace_labels: off
                annotations: off
              - name: nest
                match: kubernetes.*
                operation: lift
                nested_under: kubernetes
                add_prefix: k_
              - name: nest
                match: kubernetes.*
                operation: lift
                nested_under: k_labels
                add_prefix: k_labels_
              - name: modify
                match: kubernetes.*
                Rename:
                  - k_labels_app.kubernetes.io/name app
                  - k_labels_app app
                  - k_labels_k8s-app app
            outputs:
              - name: http
                match: kubernetes.*
                host: victoria-logs-server.observability.svc.cluster.local
                port: 9428
                uri: '/insert/jsonline?_stream_fields=stream,k_namespace_name,k_pod_name,app&_msg_field=log&_time_field=date'
                format: json_lines
                json_date_format: iso8601
                compress: gzip
                log_response_payload: off
          parsers:
            - name: containerd
              format: regex
              regex: '^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$'
              time_key: time
              time_format: '%Y-%m-%dT%H:%M:%S.%L%z'
    dashboards:
      enabled: true
    serviceMonitor:
      enabled: true
    logLevel: warn
