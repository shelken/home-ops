---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app victoria-logs
spec:
  # VictoriaLogs 不做认证；只保护路由，日志写入走的 LoadBalancer 不经网关
  components:
    - ../../../../../components/authelia
  postBuild:
    substitute:
      APP: *app
      AUTHELIA_ROUTE: victoria-logs-server
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
  interval: 1h
  retryInterval: 2m
  path: ./k8s/infra/common/observability/victoria-logs/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: false
