---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: openwrt-dns
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 1.21.1
  url: oci://ghcr.io/home-operations/charts-mirror/external-dns
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns-openwrt
spec:
  interval: 1h
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: openwrt-dns
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: *app
    provider:
      name: rfc2136
    env:
      - name: TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: &secret internal-dns-secret
            key: TSIG_SECRET
    extraArgs:
      - --ignore-ingress-tls-spec
      - --rfc2136-host=${ROUTER_IP}
      - --rfc2136-port=5354
      - --rfc2136-zone=${MAIN_DOMAIN}
      - --rfc2136-zone=${INTERNAL_DOMAIN}
      - --rfc2136-tsig-keyname=external-dns.internal.
      - --rfc2136-tsig-secret=$(TSIG_SECRET)
      - --rfc2136-tsig-secret-alg=hmac-sha256
      - --rfc2136-tsig-axfr
    # ref: https://github.com/kubernetes-sigs/external-dns/blob/master/docs/flags.md
    policy: sync
    registry: txt
    triggerLoopOnEvent: true
    sources: ["gateway-httproute", "service", "ingress"]
    txtOwnerId: internal
    txtPrefix: internal-
    domainFilters: ["${MAIN_DOMAIN}", "${INTERNAL_DOMAIN}"]
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
