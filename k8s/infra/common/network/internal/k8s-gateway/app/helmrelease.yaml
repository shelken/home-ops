---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: k8s-gateway
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 4.0.1
  url: oci://codeberg.org/k8s-gateway/charts/k8s-gateway
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  interval: 1h
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: null # 4.x 默认带 100m CPU limit，保持原先不限 CPU
        memory: 64Mi
    # ref：https://codeberg.org/k8s-gateway/k8s_gateway/src/branch/master/charts/k8s-gateway/values.yaml
    fullnameOverride: k8s-gateway
    # 4.x 镜像默认 root；容器内监听 1053 + 非 root，Service 对外仍是 53
    securityContext:
      runAsUser: 1000
    serviceType: LoadBalancer
    service:
      annotations:
        lbipam.cilium.io/ips: "192.168.69.41"
      externalTrafficPolicy: Local
    servers:
      - zones:
          - zone: .
            use_tcp: true
        port: 1053
        servicePort: 53
        plugins:
          - name: log
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: k8s_gateway
            parameters: "${MAIN_DOMAIN} ${INTERNAL_DOMAIN}"
            configBlock: |-
              apex k8s-gateway.network
              ttl 60
              resources HTTPRoute Service Ingress
              fallthrough ${MAIN_DOMAIN}
          - name: prometheus
            parameters: 0.0.0.0:9153
          # 公网递归走 DoT，绕开路由器上针对 53 端口的 DNS 重定向
          - name: forward
            parameters: ". tls://223.5.5.5"
            configBlock: |-
              tls_servername dns.alidns.com
          - name: loop
          - name: reload
          - name: loadbalance
