---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: k8s-gateway
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 3.7.2
  url: oci://codeberg.org/k8s-gateway/charts/k8s-gateway
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  interval: 1h
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # ref：https://github.com/k8s-gateway/k8s_gateway/blob/master/charts/k8s-gateway/values.yaml
    fullnameOverride: k8s-gateway
    domain: "${MAIN_DOMAIN} ${INTERNAL_DOMAIN}"
    ttl: 60
    fallthrough:
      enabled: true
    extraZonePlugins:
      - name: log
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: prometheus
        parameters: 0.0.0.0:9153
      # 内部域未匹配的名称交回主路由，供 VPS 链路解析集群外自举记录
      - name: forward
        parameters: "${INTERNAL_DOMAIN} ${ROUTER_IP}"
      # 公网递归走 DoT，绕开路由器上针对 53 端口的 DNS 重定向
      - name: forward
        parameters: ". tls://223.5.5.5"
        configBlock: |-
          tls_servername dns.alidns.com
      - name: loop
      - name: reload
      - name: loadbalance
    service:
      type: LoadBalancer
      useTcp: true
      port: 53
      annotations:
        lbipam.cilium.io/ips: "192.168.69.41"
      externalTrafficPolicy: Local
    watchedResources: ["HTTPRoute", "Service", "Ingress"]
