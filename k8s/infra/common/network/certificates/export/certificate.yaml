---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ooooo-space-tls
spec:
  secretName: ooooo-space-tls
  issuerRef:
    name: letsencrypt-production
    # name: letsencrypt-staging
    kind: ClusterIssuer
  commonName: ${MAIN_DOMAIN}
  # int 子域为 MAIN_DOMAIN 的三级通配，单级 *.{MAIN_DOMAIN} 不覆盖，DNS-01 在同一 zone 下签发
  dnsNames: ["${MAIN_DOMAIN}", "*.${MAIN_DOMAIN}", "*.${INTERNAL_DOMAIN}"]

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: second-domain-tls
spec:
  secretName: second-domain-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: ${SECOND_DOMAIN}
  dnsNames: ["${SECOND_DOMAIN}", "*.${SECOND_DOMAIN}"]
