---
# 过渡期验证用，切换到 bitwarden-store 时整个目录删除
# 与线上 Secret 比对 tls.crt/tls.key；target 独立，不带 cert-manager 注解，避免被 cert-manager 当作 Certificate 的 Secret 接管
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ooooo-space-tls-bw-check
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-store
  target:
    name: ooooo-space-tls-bw-check
    template:
      type: kubernetes.io/tls
  dataFrom:
    - extract:
        key: ooooo-space-tls
        decodingStrategy: Base64

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: second-domain-tls-bw-check
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-store
  target:
    name: second-domain-tls-bw-check
    template:
      type: kubernetes.io/tls
  dataFrom:
    - extract:
        key: second-domain-tls
        decodingStrategy: Base64
