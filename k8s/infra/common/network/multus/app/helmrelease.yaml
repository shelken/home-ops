---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus
spec:
  chartRef:
    kind: OCIRepository
    name: multus
  interval: 1h
  values:
    cni:
      binPath: /opt/cni/bin
      netPath: /etc/cni/net.d
    multus:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: multus
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: multus
              spec:
                template:
                  spec:
                    tolerations:
                      - key: dedicated
                        operator: Exists
                        effect: NoSchedule
                    containers:
                      - name: multus
                        env:
                          - name: KUBERNETES_SERVICE_HOST
                            value: "127.0.0.1"
                          - name: KUBERNETES_SERVICE_PORT
                            value: "6444"
