---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.authorization.k8s.io/clusterrolebinding_v1.json
# Web UI 以登录用户的身份（ID token 里的 email 与 groups）访问 apiserver；
# Authelia 的 admins 组拿 chart 预置的 flux-web-admin：只读集群，可对 Flux 资源执行操作
# https://fluxoperator.dev/docs/web-ui/user-management/
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-web-admins
subjects:
  - kind: Group
    name: admins
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: flux-web-admin
  apiGroup: rbac.authorization.k8s.io
