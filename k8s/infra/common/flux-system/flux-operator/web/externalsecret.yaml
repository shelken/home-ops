---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# https://fluxoperator.dev/docs/web-ui/web-config-api/
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-operator-web-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-store
  target:
    name: flux-operator-web-config
    template:
      data:
        config.yaml: |
          apiVersion: web.fluxcd.controlplane.io/v1
          kind: Config
          spec:
            baseURL: https://flux.${INTERNAL_DOMAIN}
            authentication:
              type: OAuth2
              oauth2:
                provider: OIDC
                clientID: flux-operator
                clientSecret: "{{ .FLUX_OAUTH_CLIENT_SECRET }}"
                issuerURL: https://auth.${MAIN_DOMAIN}
  dataFrom:
    - extract:
        key: flux-operator
