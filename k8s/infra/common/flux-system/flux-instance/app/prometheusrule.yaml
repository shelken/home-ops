---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-instance-rules
  namespace: flux-system
spec:
  groups:
    - name: flux-instance.rules
      rules:
        - alert: FluxInstanceAbsent
          expr: |
            absent(flux_instance_info{exported_namespace="flux-system", name="flux"})
          for: 5m
          annotations:
            summary: >-
              Flux instance metric is missing
          labels:
            severity: critical

        - alert: FluxInstanceNotReady
          expr: |
            flux_instance_info{exported_namespace="flux-system", name="flux", ready!="True"}
          for: 5m
          annotations:
            summary: >-
              Flux instance {{ $labels.name }} is not ready
          labels:
            severity: critical

        - alert: FluxResourceStalled
          expr: |-
            gotk_resource_info{customresource_kind=~"HelmRelease|Kustomization", stalled="True", suspended!="true"} == 1
          for: 5m
          annotations:
            summary: >-
              {{ $labels.customresource_kind }} {{ $labels.name }} in {{ $labels.exported_namespace }} is stalled
            description: >-
              Run kubectl -n {{ $labels.exported_namespace }} describe {{ $labels.customresource_kind | toLower }} {{ $labels.name }};
              check status.conditions and Events.
          labels:
            severity: critical
