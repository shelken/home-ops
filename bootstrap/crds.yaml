---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# task init-crd extracts all CRDs from the pinned Helm charts below.
# It is not intended to be used with helmfile apply or helmfile sync.

helmDefaults:
  args:
    - --include-crds
    - --no-hooks
  # postRenderer: bash
  # postRendererArgs:
  #   - -c
  #   - yq ea -e 'select(.kind == "CustomResourceDefinition")'

releases:
  - name: external-dns-cloudflare
    namespace: network
    chart: oci://ghcr.io/home-operations/charts-mirror/external-dns
    version: 1.23.0

  - name: external-secrets
    namespace: external-secrets
    chart: oci://ghcr.io/external-secrets/charts/external-secrets
    version: 2.14.0

  - name: envoy-gateway
    namespace: network
    chart: oci://docker.io/envoyproxy/gateway-helm
    version: 1.9.2

  - name: grafana-operator
    namespace: observability
    chart: oci://ghcr.io/grafana/helm-charts/grafana-operator
    version: 5.25.0

  # - name: keda
  #   namespace: observability
  #   chart: oci://ghcr.io/home-operations/charts-mirror/keda
  #   version: 2.18.0

  - name: kube-prometheus-stack
    namespace: observability
    chart: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    version: 92.16.0

  - name: plugin-barman-cloud
    namespace: database
    chart: oci://ghcr.io/cloudnative-pg/charts/plugin-barman-cloud
    version: 0.8.1

  - name: dragonfly-operator
    namespace: database
    chart: oci://ghcr.io/dragonflydb/dragonfly-operator/helm/dragonfly-operator
    version: v1.6.1
