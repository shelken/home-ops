---
apiVersion: v1
kind: Namespace
metadata:
  name: "external-secrets"

---
apiVersion: v1
kind: Namespace
metadata:
  name: "flux-system"

---
apiVersion: v1
kind: Secret
metadata:
  name: azure-creds
  namespace: external-secrets
stringData:
  ClientID: azure://shelken-homelab/azure-creds/ClientID
  ClientSecret: azure://shelken-homelab/azure-creds/ClientSecret

---
apiVersion: v1
kind: Secret
metadata:
  name: bitwarden-access-token
  namespace: external-secrets
stringData:
  token: bws://bitwarden-access-token

---
apiVersion: v1
kind: Secret
metadata:
  name: git-token-auth
  namespace: flux-system
stringData:
  username: bws://flux-instance/username
  password: bws://flux-instance/password

---
apiVersion: v1
kind: Secret
metadata:
  name: sops-age
  namespace: flux-system
stringData:
  age.agekey: bws://sops/SOPS_PRIVATE_KEY
