# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# 集群启停走 ansible playbook：
#   ansible-playbook -i inventory/hosts.ini -i inventory/others.ini playbooks/cluster-stop.yml
#   ansible-playbook -i inventory/hosts.ini -i inventory/others.ini playbooks/cluster-start.yml

vars:
  ANSIBLE_DIR: "{{.ROOT_DIR}}/ansible"
  INV_K8S: "{{.ROOT_DIR}}/ansible/inventory/hosts.ini"
  INV_MACH: "{{.ROOT_DIR}}/ansible/inventory/others.ini"

tasks:
  status:
    silent: true
    desc: "查看 Lima / PVE worker / k3s nodes"
    cmds:
      - task: :lima:status
      - |
        set -euo pipefail
        echo
        echo "=== PVE workers ==="
        pve="$(ansible-inventory -i "{{.INV_MACH}}" --host pve | jq -r '.ansible_user + "@" + .ansible_host')"
        vm_list="$(ssh "${pve}" 'qm list' 2>/dev/null || true)"
        while IFS=$'\t' read -r node ip; do
          [ -n "${node:-}" ] || continue
          vmid="$(echo "${vm_list}" | awk -v name="${node}" '$2 == name {print $1}')"
          if [ -z "${vmid}" ]; then
            echo "${node}  ip=${ip}  vmid=? (no matching PVE VM)"
          else
            echo "${node}  ip=${ip}  vmid=${vmid}  $(ssh "${pve}" "qm status ${vmid}")"
          fi
        done < <(ansible-inventory -i "{{.INV_K8S}}" --list \
          | jq -r '._meta.hostvars as $h | .workers.hosts[]? // empty | "\(.)\t\($h[.].ansible_host)"')
        echo
        echo "=== k3s nodes ==="
        kubectl get nodes -o wide --request-timeout=5s 2>/dev/null || echo "(API 不可达)"
