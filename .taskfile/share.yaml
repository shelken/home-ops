---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# inv.sh 只提供多处共用的 ansible_host 查询
vars:
  INV: "{{.ROOT_DIR}}/.taskfile/scripts/inv.sh"

tasks:
  host:
    silent: true
    # 调试用，不进 --list；需要时仍可 task share:host -- <name>
    internal: true
    cmds:
      - "{{.INV}} {{.CLI_ARGS}}"
