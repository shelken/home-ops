---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Lima VM 管理任务
#
# 关键事实：
# - limactl start 在 VZ 已 Running 后仍会等 guest 内部 SSH（常见 192.168.5.15:22）
# - limactl --timeout 只覆盖到 “Running”，盖不住内部 SSH 等待
# - 业务可达判据只用桥接 IP: <BRIDGE_IP>:22（不要用 Lima 内网地址）
# - limactl start 若因实例已 Running 立刻 exit 0，不能当成功
#
# 命名约定：Lima 实例名 = k8s 节点名（hosts.ini），宿主机名 = others.ini 的 endpoint 组成员。
# 新增 Lima 节点时：在 vars 加一组 LIMA_<NAME>_* 即可，任务内部全部按变量取值。
# 用法：task lima:status HOST=yuuko ｜ task lima:sync HOST=yuuko

vars:
  INV: "{{.ROOT_DIR}}/.taskfile/scripts/inv.sh"
  K8S_INV: "{{.ROOT_DIR}}/ansible/inventory/hosts.ini"
  # 上限而非固定等待：桥接通或 start 退出即提前返回，只在 start 卡死时才吃满。
  # 重建后首次启动要克隆镜像 + 建 40G 磁盘 + 跑完 cloud-init/provision，故给足。
  LIMA_START_TIMEOUT_SEC: "300"

  # 每台 Lima 宿主机一组：HOST_NAME=others.ini endpoint 名，VM_NAME=实例名
  # CONFIG_FILE=仓库内该实例的 lima.yaml（文件名按宿主机命名，不等于 VM_NAME）
  LIMA_SAKAMOTO_HOST_NAME: sakamoto
  LIMA_SAKAMOTO_VM_NAME: sakamoto-k8s
  LIMA_SAKAMOTO_CONFIG_FILE: sakamoto.yaml
  LIMA_YUUKO_HOST_NAME: yuuko
  LIMA_YUUKO_VM_NAME: yuuko-k8s
  LIMA_YUUKO_CONFIG_FILE: yuuko.yaml

tasks:
  # HOST=sakamoto|yuuko；VM 名按 HOST 取对应 *_VM_NAME
  sync:
    silent: true
    desc: "同步配置并重启（HOST=…）"
    vars:
      HOST_NAME: '{{.HOST | default "sakamoto"}}'
      VM_NAME: '{{if eq .HOST_NAME "yuuko"}}{{.LIMA_YUUKO_VM_NAME}}{{else}}{{.LIMA_SAKAMOTO_VM_NAME}}{{end}}'
      CONFIG_FILE: '{{if eq .HOST_NAME "yuuko"}}{{.LIMA_YUUKO_CONFIG_FILE}}{{else}}{{.LIMA_SAKAMOTO_CONFIG_FILE}}{{end}}'
    cmds:
      - task: _sync:config
        vars: { HOST_NAME: "{{.HOST_NAME}}", VM_NAME: "{{.VM_NAME}}", CONFIG_FILE: "{{.CONFIG_FILE}}" }
      - task: _restart
        vars: { HOST_NAME: "{{.HOST_NAME}}", VM_NAME: "{{.VM_NAME}}" }

  status:
    silent: true
    desc: "查看 Lima 实例状态（HOST=sakamoto|yuuko，默认 sakamoto）"
    vars:
      HOST_NAME: '{{.HOST | default "sakamoto"}}'
      VM_NAME: '{{if eq .HOST_NAME "yuuko"}}{{.LIMA_YUUKO_VM_NAME}}{{else}}{{.LIMA_SAKAMOTO_VM_NAME}}{{end}}'
      CONFIG_FILE: '{{if eq .HOST_NAME "yuuko"}}{{.LIMA_YUUKO_CONFIG_FILE}}{{else}}{{.LIMA_SAKAMOTO_CONFIG_FILE}}{{end}}'
    cmds:
      - task: _status
        vars: { HOST_NAME: "{{.HOST_NAME}}", VM_NAME: "{{.VM_NAME}}" }

  start:
    silent: true
    desc: "启动 Lima 实例（HOST=…）"
    vars:
      HOST_NAME: '{{.HOST | default "sakamoto"}}'
      VM_NAME: '{{if eq .HOST_NAME "yuuko"}}{{.LIMA_YUUKO_VM_NAME}}{{else}}{{.LIMA_SAKAMOTO_VM_NAME}}{{end}}'
      CONFIG_FILE: '{{if eq .HOST_NAME "yuuko"}}{{.LIMA_YUUKO_CONFIG_FILE}}{{else}}{{.LIMA_SAKAMOTO_CONFIG_FILE}}{{end}}'
    cmds:
      - task: _start
        vars: { HOST_NAME: "{{.HOST_NAME}}", VM_NAME: "{{.VM_NAME}}" }

  stop:
    silent: true
    desc: "停止 Lima 实例（HOST=…）"
    vars:
      HOST_NAME: '{{.HOST | default "sakamoto"}}'
      VM_NAME: '{{if eq .HOST_NAME "yuuko"}}{{.LIMA_YUUKO_VM_NAME}}{{else}}{{.LIMA_SAKAMOTO_VM_NAME}}{{end}}'
      CONFIG_FILE: '{{if eq .HOST_NAME "yuuko"}}{{.LIMA_YUUKO_CONFIG_FILE}}{{else}}{{.LIMA_SAKAMOTO_CONFIG_FILE}}{{end}}'
    cmds:
      - task: _stop
        vars: { HOST_NAME: "{{.HOST_NAME}}", VM_NAME: "{{.VM_NAME}}" }

  restart:
    silent: true
    desc: "重启 Lima 实例（HOST=…）"
    vars:
      HOST_NAME: '{{.HOST | default "sakamoto"}}'
      VM_NAME: '{{if eq .HOST_NAME "yuuko"}}{{.LIMA_YUUKO_VM_NAME}}{{else}}{{.LIMA_SAKAMOTO_VM_NAME}}{{end}}'
      CONFIG_FILE: '{{if eq .HOST_NAME "yuuko"}}{{.LIMA_YUUKO_CONFIG_FILE}}{{else}}{{.LIMA_SAKAMOTO_CONFIG_FILE}}{{end}}'
    cmds:
      - task: _restart
        vars: { HOST_NAME: "{{.HOST_NAME}}", VM_NAME: "{{.VM_NAME}}" }

  diff:
    silent: true
    desc: "对比运行配置与仓库差异（HOST=…）"
    vars:
      HOST_NAME: '{{.HOST | default "sakamoto"}}'
      VM_NAME: '{{if eq .HOST_NAME "yuuko"}}{{.LIMA_YUUKO_VM_NAME}}{{else}}{{.LIMA_SAKAMOTO_VM_NAME}}{{end}}'
      CONFIG_FILE: '{{if eq .HOST_NAME "yuuko"}}{{.LIMA_YUUKO_CONFIG_FILE}}{{else}}{{.LIMA_SAKAMOTO_CONFIG_FILE}}{{end}}'
    cmds:
      - task: _diff
        vars: { HOST_NAME: "{{.HOST_NAME}}", VM_NAME: "{{.VM_NAME}}", CONFIG_FILE: "{{.CONFIG_FILE}}" }

  _sync:config:
    internal: true
    vars:
      HOST_NAME: "{{.HOST_NAME}}"
      VM_NAME: "{{.VM_NAME}}"
      CONFIG_FILE: "{{.CONFIG_FILE}}"
    cmd: |
      set -euo pipefail
      host="$({{.INV}} {{.HOST_NAME}})"
      vm="{{.VM_NAME}}"
      # 幂等：实例目录可能不存在（重建流程先 limactl delete）。
      # mkdir -p 对已存在目录是空操作；scp 覆盖写入。
      # 不写死 ~ ：scp 走 SFTP 时服务端不保证展开 tilde，改为解析 $HOME。
      dir="$(ssh "${host}" "mkdir -p \"\$HOME/.lima/${vm}\" && printf %s \"\$HOME/.lima/${vm}\"")"
      echo "同步配置到 ${host}:${dir}/lima.yaml ..."
      scp {{.ROOT_DIR}}/lima/{{.CONFIG_FILE}} "${host}:${dir}/lima.yaml"
      echo "✓ 配置同步完成"

  _restart:
    internal: true
    cmd: |
      set -euo pipefail
      host="$({{.INV}} {{.HOST_NAME}})"
      vm="{{.VM_NAME}}"
      bridge_ip="$(ansible-inventory -i "{{.K8S_INV}}" --host "${vm}" | jq -re .ansible_host)"
      echo "正在重启 ${vm}..."
      ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=40 "${host}" \
        "set -euo pipefail
         # 1) 停机：普通 stop 失败则 force
         if ! limactl stop ${vm}; then
           echo 'WARN: limactl stop 失败，改用 --force'
           limactl stop --force ${vm} || true
         fi
         limactl disk unlock longhorn || true

         # 1.5) 等待宿主清理完成：优雅 stop 返回时旧 VZ XPC 服务与 socket_vmnet
         # daemon 的释放有 1~2s 滞后，立即 start 会撞上窗口导致 VZ 创建失败
         # （症状：首次 start 必失败，第二次成功；2026-09-24 实测）
         sleep 5

         # 2) 后台 start（可能卡在内部 SSH 探测），失败自动 force-stop 重试一次
         # 宿主的 rm 可能是 home-manager 包成的 trash，删不存在的文件会返回非 0，
         # 配合 set -e 会中止整个脚本，故容错
         rm -f /tmp/lima-start-${vm}.log /tmp/lima-start-${vm}.exit || true
         # 子 shell 内关掉 errexit：否则 limactl start 失败会让子 shell 立刻退出，
         # 下一行的退出码永远写不出来，轮询只能空等到超时
         ( set +e
           limactl start --tty=false ${vm} > /tmp/lima-start-${vm}.log 2>&1
           echo \$? > /tmp/lima-start-${vm}.exit
         ) &
         start_pid=\$!

         # 若 start 立刻失败（如清理竞态仍存在），force-stop 清理后重试一次
         for w in \$(seq 1 10); do
           [ -f /tmp/lima-start-${vm}.exit ] && break
           kill -0 \$start_pid 2>/dev/null || break
           sleep 1
         done
         if [ -f /tmp/lima-start-${vm}.exit ]; then
           code=\$(cat /tmp/lima-start-${vm}.exit)
           if [ \"\$code\" != 0 ]; then
             echo \"WARN: limactl start 失败(exit=\$code)，force-stop 后重试一次\"
             tail -20 /tmp/lima-start-${vm}.log || true
             limactl stop --force ${vm} || true
             limactl disk unlock longhorn || true
             sleep 5
             rm -f /tmp/lima-start-${vm}.log /tmp/lima-start-${vm}.exit || true
             ( set +e
               limactl start --tty=false ${vm} > /tmp/lima-start-${vm}.log 2>&1
               echo \$? > /tmp/lima-start-${vm}.exit
             ) &
             start_pid=\$!
           fi
         fi

         # 3) 唯一成功条件：桥接 IP SSH 通
         ok=0
         for i in \$(seq 1 {{.LIMA_START_TIMEOUT_SEC}}); do
           if ping -c 1 -W 1 ${bridge_ip} >/dev/null 2>&1 \
              && nc -z -w 1 ${bridge_ip} 22 >/dev/null 2>&1; then
             ok=1
             break
           fi
           # start 已结束且非 0 → 立即失败，不再空等
           if [ -f /tmp/lima-start-${vm}.exit ]; then
             code=\$(cat /tmp/lima-start-${vm}.exit)
             if [ \"\$code\" != 0 ]; then
               echo 'limactl start failed:'
               tail -80 /tmp/lima-start-${vm}.log || true
               exit \"\$code\"
             fi
             # exit 0 但桥接未通：继续等，不立刻成功
           elif ! kill -0 \$start_pid 2>/dev/null; then
             # 进程已消失但没留下退出码 → 同样按失败处理
             echo 'limactl start 进程已退出，且未写出退出码:'
             tail -80 /tmp/lima-start-${vm}.log || true
             exit 1
           fi
           # 每 5 秒报一次进度，避免长时间静默
           if [ \$(( i % 5 )) -eq 0 ]; then
             echo \"  等待 ${vm} 桥接就绪 \${i}/{{.LIMA_START_TIMEOUT_SEC}}s\"
           fi
           sleep 1
         done

         if [ \"\$ok\" != 1 ]; then
           echo 'ERROR: {{.LIMA_START_TIMEOUT_SEC}}s 内 ${bridge_ip}:22 未就绪'
           echo '--- limactl list ---'
           limactl list || true
           echo '--- start log ---'
           tail -100 /tmp/lima-start-${vm}.log || true
           kill \$start_pid 2>/dev/null || true
           exit 1
         fi

         if [ ! -f /tmp/lima-start-${vm}.exit ]; then
           echo 'INFO: ${bridge_ip} 已通；结束等待 limactl 内部 SSH'
           kill \$start_pid 2>/dev/null || true
         fi
         limactl list
        "
      echo "✓ VM 已重启（${bridge_ip}:22 可达）"

  _stop:
    internal: true
    cmd: |
      set -euo pipefail
      host="$({{.INV}} {{.HOST_NAME}})"
      ssh "${host}" "
        limactl stop {{.VM_NAME}} || limactl stop --force {{.VM_NAME}}
      "
      echo "✓ VM 已停止"

  _start:
    internal: true
    cmd: |
      set -euo pipefail
      host="$({{.INV}} {{.HOST_NAME}})"
      vm="{{.VM_NAME}}"
      bridge_ip="$(ansible-inventory -i "{{.K8S_INV}}" --host "${vm}" | jq -re .ansible_host)"
      ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=40 "${host}" \
        "set -euo pipefail
         limactl disk unlock longhorn || true
         # 宿主 rm 可能是 home-manager 的 trash，删不存在的文件返回非 0，故容错
         rm -f /tmp/lima-start-${vm}.log /tmp/lima-start-${vm}.exit || true
         # 子 shell 内关掉 errexit，保证退出码一定被写出（详见 _restart 注释）
         ( set +e
           limactl start --tty=false ${vm} > /tmp/lima-start-${vm}.log 2>&1
           echo \$? > /tmp/lima-start-${vm}.exit
         ) &
         start_pid=\$!
         ok=0
         for i in \$(seq 1 {{.LIMA_START_TIMEOUT_SEC}}); do
           if ping -c 1 -W 1 ${bridge_ip} >/dev/null 2>&1 \
              && nc -z -w 1 ${bridge_ip} 22 >/dev/null 2>&1; then
             ok=1
             break
           fi
           if [ -f /tmp/lima-start-${vm}.exit ]; then
             code=\$(cat /tmp/lima-start-${vm}.exit)
             if [ \"\$code\" != 0 ]; then
               echo 'limactl start failed:'
               tail -80 /tmp/lima-start-${vm}.log || true
               exit \"\$code\"
             fi
           elif ! kill -0 \$start_pid 2>/dev/null; then
             echo 'limactl start 进程已退出，且未写出退出码:'
             tail -80 /tmp/lima-start-${vm}.log || true
             exit 1
           fi
           if [ \$(( i % 5 )) -eq 0 ]; then
             echo \"  等待 ${vm} 桥接就绪 \${i}/{{.LIMA_START_TIMEOUT_SEC}}s\"
           fi
           sleep 1
         done
         if [ \"\$ok\" != 1 ]; then
           echo 'ERROR: {{.LIMA_START_TIMEOUT_SEC}}s 内 ${bridge_ip}:22 未就绪'
           tail -100 /tmp/lima-start-${vm}.log || true
           kill \$start_pid 2>/dev/null || true
           exit 1
         fi
         if [ ! -f /tmp/lima-start-${vm}.exit ]; then
           kill \$start_pid 2>/dev/null || true
         fi
         limactl list
        "
      echo "✓ VM 已启动（${bridge_ip}:22 可达）"

  _status:
    internal: true
    cmd: |
      set -euo pipefail
      host="$({{.INV}} {{.HOST_NAME}})"
      vm="{{.VM_NAME}}"
      bridge_ip="$(ansible-inventory -i "{{.K8S_INV}}" --host "${vm}" | jq -re .ansible_host)"
      ssh "${host}" "limactl list"
      echo "--- bridge ---"
      ping -c 1 -W 2 "${bridge_ip}" >/dev/null 2>&1 && echo "${bridge_ip} ping ok" || echo "${bridge_ip} ping FAIL"

  _diff:
    internal: true
    vars:
      CONFIG_FILE: "{{.CONFIG_FILE}}"
    cmd: |
      set -euo pipefail
      host="$({{.INV}} {{.HOST_NAME}})"
      vm="{{.VM_NAME}}"
      ssh "${host}" "cat ~/.lima/${vm}/lima.yaml" > /tmp/lima-vm-current.yaml
      if command -v delta >/dev/null 2>&1; then
        git --no-pager diff --no-index --color=always -- /tmp/lima-vm-current.yaml {{.ROOT_DIR}}/lima/{{.CONFIG_FILE}} \
          | delta --paging=never \
          || true
      else
        git --no-pager diff --no-index --color=always -- /tmp/lima-vm-current.yaml {{.ROOT_DIR}}/lima/{{.CONFIG_FILE}} \
          || true
      fi

  status:all:
    silent: true
    desc: "查看全部 Lima 宿主与实例状态"
    cmd: |
      set -euo pipefail
      for entry in {{.LIMA_SAKAMOTO_HOST_NAME}}:{{.LIMA_SAKAMOTO_VM_NAME}} {{.LIMA_YUUKO_HOST_NAME}}:{{.LIMA_YUUKO_VM_NAME}}; do
        host_name="${entry%%:*}"
        vm_name="${entry##*:}"
        echo "=== ${vm_name} @ ${host_name} ==="
        host="$({{.INV}} "${host_name}")"
        bridge_ip="$(ansible-inventory -i "{{.K8S_INV}}" --host "${vm_name}" 2>/dev/null | jq -re .ansible_host 2>/dev/null || echo unreachable)"
        ssh -o ConnectTimeout=5 "${host}" "limactl list | grep -E 'NAME|^${vm_name}'" || echo "(宿主不可达)"
        if [ "${bridge_ip}" != "unreachable" ]; then
          ping -c 1 -W 2 "${bridge_ip}" >/dev/null 2>&1 && echo "bridge ${bridge_ip} ok" || echo "bridge ${bridge_ip} FAIL"
        fi
      done
