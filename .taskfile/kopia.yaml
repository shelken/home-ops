---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# VPS/compose 路径的 kopia 拉推。
# 集群 PVC 恢复用 task kopiur:*（.taskfile/kopiur.yaml）。

vars:
  INV: "{{.ROOT_DIR}}/.taskfile/scripts/inv.sh"
  SOURCE_HOST:
    sh: '"{{.INV}}" sakamoto'
  SOURCE_KOPIA_CONTAINER: kopia
  TARGET_HOST:
    sh: '"{{.INV}}" vps-cc'
  TARGET_DATA_DIR: /data/docker
  # kopia snapshot source 字符串，非 SSH 主机
  KOPIA_BACKUP_SOURCE: shelken@vps:/backup/data
  STAGING_DIR: /tmp/kopia-restore-vps
  STAGING_MARKER: "{{.STAGING_DIR}}/.snapshot_id"
  STAGING_ARCHIVE: "{{.STAGING_DIR}}/snapshot.tar"
  KOPIA_POD: "kubectl exec -n kopiur-system deploy/kopia -- kopia"
  KOPIA_EXEC: "kubectl exec -n kopiur-system deploy/kopia --"

tasks:
  list:
    silent: true
    desc: "列出 sakamoto 上 kopia 容器中的可用 snapshot"
    cmds:
      - echo "Snapshots for {{.KOPIA_BACKUP_SOURCE}}:"
      - ssh {{.SOURCE_HOST}} "docker exec {{.SOURCE_KOPIA_CONTAINER}} kopia snapshot list --all '{{.KOPIA_BACKUP_SOURCE}}'"

  pull:
    silent: true
    desc: "从源拉取 snapshot 到本地临时目录（SNAPSHOT_ID=xxx [FORCE=1]）"
    cmds:
      - |
        if [ -f "{{.STAGING_MARKER}}" ] && [ -z "$FORCE" ]; then
          existing_id=$(cat "{{.STAGING_MARKER}}")
          echo "本地已有数据 (Snapshot ID: $existing_id)"
          echo "如需重新下载，请设置 FORCE=1"
          echo "如需直接推送，运行: task kopia:push"
          exit 0
        fi
        if [ -z "$SNAPSHOT_ID" ]; then
          echo "错误: SNAPSHOT_ID 不能为空"
          exit 1
        fi
        mkdir -p "{{.STAGING_DIR}}"
        echo "Restoring snapshot $SNAPSHOT_ID to container..."
        ssh {{.SOURCE_HOST}} "docker exec {{.SOURCE_KOPIA_CONTAINER}} kopia snapshot restore \"$SNAPSHOT_ID\" /tmp/kopia-tmp"
        echo "Streaming archive from container to local..."
        ssh {{.SOURCE_HOST}} "docker exec {{.SOURCE_KOPIA_CONTAINER}} tar --numeric-owner -cpf - -C /tmp/kopia-tmp ." > "{{.STAGING_ARCHIVE}}"
        echo "$SNAPSHOT_ID" > "{{.STAGING_MARKER}}"
        echo "Archive saved to {{.STAGING_ARCHIVE}}"

  push:
    silent: true
    desc: "将本地暂存的 snapshot 推送至目标机器"
    cmds:
      - |
        if [ ! -f "{{.STAGING_ARCHIVE}}" ]; then
          echo "错误: 本地没有数据"
          echo "请先运行: SNAPSHOT_ID=xxx task kopia:pull"
          exit 1
        fi
      - |
        if [ -f "{{.STAGING_MARKER}}" ]; then
          echo "正在推送 Snapshot ID: $(cat \"{{.STAGING_MARKER}}\")"
        fi
      - echo "Pushing archive to target..."
      - rsync -avz --progress "{{.STAGING_ARCHIVE}}" {{.TARGET_HOST}}:/tmp/kopia-restore.tar
      - echo "Extracting archive on target..."
      - ssh {{.TARGET_HOST}} "mkdir -p \"{{.TARGET_DATA_DIR}}\""
      - ssh {{.TARGET_HOST}} "tar --numeric-owner -xpf /tmp/kopia-restore.tar -C \"{{.TARGET_DATA_DIR}}\""
      - echo "Done"

  clean:
    silent: true
    desc: "清理本地临时数据"
    cmds:
      - |
        if [ -d "{{.STAGING_DIR}}" ]; then
          echo "清理本地数据: {{.STAGING_DIR}}"
          rm -rf "{{.STAGING_DIR}}"
          echo "完成"
        else
          echo "没有需要清理的数据"
        fi

  full:
    silent: true
    desc: "完整的恢复流程（拉取 → 推送，SNAPSHOT_ID=xxx [FORCE=1]）"
    cmds:
      - |
        if [ -f "{{.STAGING_MARKER}}" ] && [ -z "$FORCE" ] && [ -z "$SNAPSHOT_ID" ]; then
          echo "检测到本地已有数据，跳过下载，直接推送..."
          echo "如需重新下载，请设置 SNAPSHOT_ID=xxx FORCE=1"
        elif [ -n "$SNAPSHOT_ID" ]; then
          task kopia:pull
        else
          echo "错误: 本地没有数据，请设置 SNAPSHOT_ID"
          exit 1
        fi
      - task: push


  migrate-inactive:
    desc: "将未启用服务的最新快照从旧库(kopia-backup)冷迁移到新库(kopiur)"
    cmds:
      - |
        TMP_DIR=$(mktemp -d)
        trap 'rm -rf "$TMP_DIR"' EXIT

        echo "==> 获取 Kopia 连接凭据..."
        AWS_ACCESS_KEY_ID=$(kubectl -n kopiur-system get secret kopiur-repository-secret -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)
        AWS_SECRET_ACCESS_KEY=$(kubectl -n kopiur-system get secret kopiur-repository-secret -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)
        KOPIA_PASSWORD=$(kubectl -n kopiur-system get secret kopiur-repository-secret -o jsonpath='{.data.KOPIA_PASSWORD}' | base64 -d)

        echo "==> 连接源仓库 (s3/kopia-backup)..."
        env AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            KOPIA_PASSWORD="$KOPIA_PASSWORD" \
            KOPIA_CHECK_FOR_UPDATES=false \
            kopia repository connect s3 \
              --config-file="$TMP_DIR/src.config" \
              --cache-directory="$TMP_DIR/src-cache" \
              --bucket=kopia-backup \
              --endpoint=sakamoto.lan:9000 \
              --disable-tls 2>/dev/null

        echo "==> 连接目标仓库 (s3/kopiur)..."
        env AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            KOPIA_PASSWORD="$KOPIA_PASSWORD" \
            KOPIA_CHECK_FOR_UPDATES=false \
            kopia repository connect s3 \
              --config-file="$TMP_DIR/dst.config" \
              --cache-directory="$TMP_DIR/dst-cache" \
              --bucket=kopiur \
              --endpoint=sakamoto.lan:9000 \
              --disable-tls 2>/dev/null

        INACTIVE_SOURCES="affine@default:/data karakeep@default:/data n8n@default:/data new-api@default:/data ollama@default:/data ollama-web@default:/data seafile-db@default:/data slash@default:/data vaultwarden@default:/data homarr@default:/data scrypted@default:/data"
        SOURCES_ARGS=""
        for src in $INACTIVE_SOURCES; do
          SOURCES_ARGS="$SOURCES_ARGS --sources=$src"
        done

        echo "==> 开始冷迁移未启用服务的最新快照 (--latest-only)..."
        env KOPIA_PASSWORD="$KOPIA_PASSWORD" \
            KOPIA_CHECK_FOR_UPDATES=false \
            kopia snapshot migrate \
              --source-config="$TMP_DIR/src.config" \
              --config-file="$TMP_DIR/dst.config" \
              $SOURCES_ARGS \
              --latest-only \
              --no-policies

        echo "==> 将快照路径从 /data 转换至 Kopiur 标准 /pvc/* ..."
        for src in $INACTIVE_SOURCES; do
          user=$(echo "$src" | cut -d'@' -f1)
          host=$(echo "$src" | cut -d'@' -f2 | cut -d':' -f1)
          dst_source="${user}@${host}:/pvc/${user}"
          env KOPIA_PASSWORD="$KOPIA_PASSWORD" KOPIA_CHECK_FOR_UPDATES=false \
            kopia snapshot move-history --config-file="$TMP_DIR/dst.config" "$src" "$dst_source" 2>/dev/null || true
          env KOPIA_PASSWORD="$KOPIA_PASSWORD" KOPIA_CHECK_FOR_UPDATES=false \
            kopia policy delete --config-file="$TMP_DIR/dst.config" "$src" 2>/dev/null || true
        done

        echo "==> 迁移完成，目标库 (kopiur) 快照列表："
        env KOPIA_PASSWORD="$KOPIA_PASSWORD" \
            KOPIA_CHECK_FOR_UPDATES=false \
            kopia snapshot list --all \
              --config-file="$TMP_DIR/dst.config"
    preconditions:
      - { msg: "kopia not found", sh: "which kopia" }
      - { msg: "kubectl not found", sh: "which kubectl" }

  migrate-active:
    desc: "将活跃服务的最新快照基线从旧库(kopia-backup)冷迁移到新库(kopiur)并转换路径至 /pvc/*"
    cmds:
      - |
        TMP_DIR=$(mktemp -d)
        trap 'rm -rf "$TMP_DIR"' EXIT

        echo "==> 获取 Kopia 连接凭据..."
        AWS_ACCESS_KEY_ID=$(kubectl -n kopiur-system get secret kopiur-repository-secret -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)
        AWS_SECRET_ACCESS_KEY=$(kubectl -n kopiur-system get secret kopiur-repository-secret -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)
        KOPIA_PASSWORD=$(kubectl -n kopiur-system get secret kopiur-repository-secret -o jsonpath='{.data.KOPIA_PASSWORD}' | base64 -d)

        echo "==> 连接源仓库 (s3/kopia-backup)..."
        env AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            KOPIA_PASSWORD="$KOPIA_PASSWORD" \
            KOPIA_CHECK_FOR_UPDATES=false \
            kopia repository connect s3 \
              --config-file="$TMP_DIR/src.config" \
              --cache-directory="$TMP_DIR/src-cache" \
              --bucket=kopia-backup \
              --endpoint=sakamoto.lan:9000 \
              --disable-tls 2>/dev/null

        echo "==> 连接目标仓库 (s3/kopiur)..."
        env AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            KOPIA_PASSWORD="$KOPIA_PASSWORD" \
            KOPIA_CHECK_FOR_UPDATES=false \
            kopia repository connect s3 \
              --config-file="$TMP_DIR/dst.config" \
              --cache-directory="$TMP_DIR/dst-cache" \
              --bucket=kopiur \
              --endpoint=sakamoto.lan:9000 \
              --disable-tls 2>/dev/null

        ACTIVE_SOURCES="cli-proxy-api@default:/data cpa-usage-keeper@default:/data crowdsec@security:/data frigate@default:/data home-assistant@default:/data jellyfin@default:/data metatube@default:/data openlist@default:/data plex@default:/data pocket-id@security:/data qbittorrent@default:/data qui@default:/data"
        SOURCES_ARGS=""
        for src in $ACTIVE_SOURCES; do
          SOURCES_ARGS="$SOURCES_ARGS --sources=$src"
        done

        echo "==> 开始冷迁移活跃服务的最新基线快照 (--latest-only)..."
        env KOPIA_PASSWORD="$KOPIA_PASSWORD" \
            KOPIA_CHECK_FOR_UPDATES=false \
            kopia snapshot migrate \
              --source-config="$TMP_DIR/src.config" \
              --config-file="$TMP_DIR/dst.config" \
              $SOURCES_ARGS \
              --latest-only \
              --no-policies

        echo "==> 将快照路径从 /data 转换至 Kopiur 标准 /pvc/* ..."
        for src in $ACTIVE_SOURCES; do
          user=$(echo "$src" | cut -d'@' -f1)
          host=$(echo "$src" | cut -d'@' -f2 | cut -d':' -f1)
          dst_source="${user}@${host}:/pvc/${user}"
          env KOPIA_PASSWORD="$KOPIA_PASSWORD" KOPIA_CHECK_FOR_UPDATES=false \
            kopia snapshot move-history --config-file="$TMP_DIR/dst.config" "$src" "$dst_source" 2>/dev/null || true
          env KOPIA_PASSWORD="$KOPIA_PASSWORD" KOPIA_CHECK_FOR_UPDATES=false \
            kopia policy delete --config-file="$TMP_DIR/dst.config" "$src" 2>/dev/null || true
        done

        echo "==> 迁移完成，目标库 (kopiur) 快照列表："
        env KOPIA_PASSWORD="$KOPIA_PASSWORD" \
            KOPIA_CHECK_FOR_UPDATES=false \
            kopia snapshot list --all \
              --config-file="$TMP_DIR/dst.config"
    preconditions:
      - { msg: "kopia not found", sh: "which kopia" }
      - { msg: "kubectl not found", sh: "which kubectl" }
