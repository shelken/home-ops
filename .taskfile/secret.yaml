---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

set: [pipefail]
shopt: [globstar]

vars:
  VAULT_NAME: shelken-homelab

tasks:
  azsecret:
    desc: 显示 {{ .VAULT_NAME }} 某个secret的value，如果没有传则显示namelist列表
    silent: true
    cmd: |
      if [ -n "{{ .key }}" ]; then
        az keyvault secret show --vault-name {{ .VAULT_NAME }} --name "{{ .key }}" --query value -otsv
        exit 0
      fi
      az keyvault secret list --vault-name {{ .VAULT_NAME }} --query "[].name"

  set-key:
    desc: 设置 JSON secret [secret] 中的 [key]=[value]（不存在则创建，已存在则更新）
    requires:
      vars: ["secret", "key", "value"]
    cmd: |
      [ -z "{{ .value }}" ] && echo "value 不能为空" && exit 1
      current=$(az keyvault secret show --vault-name {{ .VAULT_NAME }} --name "{{ .secret }}" --query value -otsv 2>/dev/null || echo "{}")
      updated=$(echo "$current" | jq --arg k "{{ .key }}" --arg v "{{ .value }}" '. + {($k): $v}')
      echo "$updated" | az keyvault secret set --vault-name {{ .VAULT_NAME }} --name "{{ .secret }}" --value @- > /dev/null
      $(exit 0)
    silent: true

  init-authelia-oidc-client:
    desc: 初始化 Authelia OIDC client，将明文写入 JSON secret 并设置 client digest
    requires:
      vars: ["secret", "key", "client"]
    env:
      TARGET_SECRET: "{{ .secret }}"
      CLIENT_SECRET_KEY: "{{ .key }}"
      CLIENT_ID: "{{ .client }}"
    silent: true
    cmd: |
      set -euo pipefail
      config="{{.ROOT_DIR}}/k8s/infra/common/security/authelia/app/configuration.yaml"
      helmrelease="{{.ROOT_DIR}}/k8s/infra/common/security/authelia/app/helmrelease.yaml"
      count=$(yq '[.identity_providers.oidc.clients[] | select(.client_id == strenv(CLIENT_ID))] | length' "$config")
      [ "$count" -eq 1 ] || { echo "client_id 必须唯一，当前匹配数: $count"; exit 1; }
      initialized=$(yq -r '.identity_providers.oidc.clients[] | select(.client_id == strenv(CLIENT_ID)).client_secret != ""' "$config")
      [ "$initialized" = "false" ] || { echo "client 已初始化，拒绝覆盖"; exit 1; }

      repository=$(yq -r '.spec.values.controllers.authelia.containers.app.image.repository' "$helmrelease")
      tag=$(yq -r '.spec.values.controllers.authelia.containers.app.image.tag' "$helmrelease")
      [ "$repository" != "null" ] && [ "$tag" != "null" ] || { echo "无法读取 Authelia 镜像"; exit 1; }

      tmp=$(mktemp)
      trap 'rm -f "$tmp"' EXIT
      chmod 600 "$tmp"
      cp "$config" "$tmp"

      output=$(docker run --rm "${repository}:${tag}" \
        authelia crypto hash generate argon2 \
        --random --random.length 64 --random.charset alphanumeric 2>&1)
      password_count=$(printf '%s\n' "$output" | grep -c '^Random Password: ' || true)
      digest_count=$(printf '%s\n' "$output" | grep -c '^Digest: ' || true)
      [ "$password_count" -eq 1 ] && [ "$digest_count" -eq 1 ] || { echo "Authelia 密钥输出格式异常"; exit 1; }
      client_secret=$(printf '%s\n' "$output" | awk -F': ' '/^Random Password:/ {print $2}')
      client_digest=$(printf '%s\n' "$output" | awk -F': ' '/^Digest:/ {print $2}')
      [ -n "$client_secret" ] && [ -n "$client_digest" ] || { echo "Authelia 未返回完整密钥对"; exit 1; }

      CLIENT_DIGEST="$client_digest" ruby - "$tmp" <<'RUBY'
      path = ARGV.fetch(0)
      client_id = ENV.fetch("CLIENT_ID")
      digest = ENV.fetch("CLIENT_DIGEST")
      lines = File.readlines(path)
      client_pattern = /^      - client_id:\s*["']?#{Regexp.escape(client_id)}["']?\s*$/
      starts = lines.each_index.select { |index| lines[index].match?(client_pattern) }
      raise "client_id must match exactly once" unless starts.length == 1
      start = starts.first
      finish = ((start + 1)...lines.length).find { |index| lines[index].match?(/^      - client_id:/) } || lines.length
      secrets = (start...finish).select { |index| lines[index].match?(/^        client_secret:\s*.*$/) }
      raise "client_secret must match exactly once" unless secrets.length == 1
      newline = lines[secrets.first].end_with?("\n") ? "\n" : ""
      lines[secrets.first] = %(        client_secret: "#{digest}"#{newline})
      File.write(path, lines.join)
      RUBY
      CLIENT_DIGEST="$client_digest" yq -e \
        '.identity_providers.oidc.clients[] | select(.client_id == strenv(CLIENT_ID)).client_secret == strenv(CLIENT_DIGEST)' \
        "$tmp" > /dev/null

      task secret:set-key secret="$TARGET_SECRET" key="$CLIENT_SECRET_KEY" value="$client_secret" > /dev/null 2>&1
      cat "$tmp" > "$config"
      unset output client_secret client_digest CLIENT_DIGEST
      echo "✓ Authelia OIDC client 已初始化"

  keys:
    desc: 查看 JSON secret [secret] 中有哪些 key（不显示值）
    requires:
      vars: ["secret"]
    silent: true
    cmd: |
      az keyvault secret show --vault-name {{ .VAULT_NAME }} --name "{{ .secret }}" --query value -otsv 2>/dev/null | jq 'keys' || { echo "未找到"; exit 1; }

  azure-creds-list:
    desc: 查看 External Secrets Azure App 的所有 credential 元数据（不显示 secret value）
    silent: true
    cmd: |
      client_id=$(az keyvault secret show --vault-name {{ .VAULT_NAME }} --name azure-creds --query value -otsv | jq -r '.ClientID')
      az ad app credential list --id "$client_id" \
        --query '[].{displayName:displayName,keyId:keyId,startDateTime:startDateTime,endDateTime:endDateTime}' \
        -o table

  azure-creds-rotate:
    desc: 轮换 External Secrets Azure App credential，验证 ESO 恢复后删除旧 credential（默认 years=1）
    silent: true
    vars:
      years: '{{ .years | default "1" }}'
      display_name:
        sh: echo 'external-secrets-'$(date -u +%Y%m%d)
    cmd: |
      old_keys=$(mktemp)
      trap 'rm -f "$old_keys"' EXIT
      client_id=$(az keyvault secret show --vault-name {{ .VAULT_NAME }} --name azure-creds --query value -otsv | jq -r '.ClientID')
      az ad app credential list --id "$client_id" --query '[].keyId' -o tsv > "$old_keys"
      new_secret=$(az ad app credential reset \
        --id "$client_id" \
        --append \
        --display-name "{{ .display_name }}" \
        --years {{ .years }} \
        --query password \
        -o tsv)
      jq -n --arg id "$client_id" --arg secret "$new_secret" '{ClientID:$id,ClientSecret:$secret}' \
        | az keyvault secret set --vault-name {{ .VAULT_NAME }} --name azure-creds --value @- > /dev/null
      unset new_secret
      task secret:bootstrap
      kubectl -n external-secrets rollout restart deploy/external-secrets
      kubectl -n external-secrets rollout status deploy/external-secrets --timeout=120s
      kubectl get clustersecretstore azure-store -o json \
        | jq -e 'any(.status.conditions[]?; .type == "Ready" and .status == "True")' > /dev/null
      kubectl get externalsecret -A -o json \
        | jq -e 'all(.items[]; any(.status.conditions[]?; .type == "Ready" and .status == "True"))' > /dev/null
      while IFS= read -r key_id; do
        [ -z "$key_id" ] && continue
        az ad app credential delete --id "$client_id" --key-id "$key_id"
      done < "$old_keys"
      echo "✓ azure-creds 已轮换并生效；旧 credential 已删除；新 credential 有效期 {{ .years }} 年"

  edit:
    silent: true
    desc: 用 vim 编辑 KeyVault 中的 JSON secret
    requires:
      vars: ["secret"]
    cmd: |
      tmp=$(mktemp)
      az keyvault secret show --vault-name {{ .VAULT_NAME }} --name "{{ .secret }}" --query value -otsv 2>/dev/null > "$tmp" || echo "{}" > "$tmp"
      chmod 600 "$tmp"
      before=$(sha256sum < "$tmp")
      vim "$tmp"
      after=$(sha256sum < "$tmp")
      if [ "$before" != "$after" ] && [ -s "$tmp" ] && jq . "$tmp" > /dev/null 2>&1; then
        cat "$tmp" | az keyvault secret set --vault-name {{ .VAULT_NAME }} --name "{{ .secret }}" --value @- > /dev/null
        echo "✓ {{ .secret }} 已更新"
      elif [ ! -s "$tmp" ]; then
        echo "✗ 内容已清空，未写入"
      elif ! jq . "$tmp" > /dev/null 2>&1; then
        echo "✗ JSON 格式错误，未写入"
      else
        echo "→ 未检测到变更，跳过"
      fi
      rm -f "$tmp"

  delete-key:
    desc: 删除 JSON secret [secret] 中的某个 [key]
    requires:
      vars: ["secret", "key"]
    prompt: 确定要删除 secret "{{ .secret }}" 中的 key "{{ .key }}" 吗？
    cmd: |
      current=$(az keyvault secret show --vault-name {{ .VAULT_NAME }} --name "{{ .secret }}" --query value -otsv)
      updated=$(echo "$current" | jq 'del(."{{ .key }}")')
      echo "$updated" | az keyvault secret set --vault-name {{ .VAULT_NAME }} --name "{{ .secret }}" --value @- > /dev/null
      $(exit 0)
    silent: true

  delete:
    silent: true
    desc: 删除 {{ .VAULT_NAME }} 中的某个 secret（交互式选择或指定 key=xxx）
    prompt: 确定要删除 secret "{{ .key }}" 吗？此操作不可逆！
    vars:
      key:
        sh: |
          if [ -n "{{ .key }}" ]; then
            echo "{{ .key }}"
          else
            az keyvault secret list --vault-name {{ .VAULT_NAME }} --query "[].name" -otsv | fzf --prompt="选择要删除的 secret: "
          fi
    cmd: |
      [ -z "{{ .key }}" ] && echo "未选择任何 secret" && exit 1
      az keyvault secret delete --vault-name {{ .VAULT_NAME }} --name "{{ .key }}"

  bootstrap:
    silent: true
    desc: 加载 bootstrap/resources.yaml 中的所有信息到集群
    cmd: |
      output=$(bash {{.ROOT_DIR}}/scripts/azure-inject.sh {{.ROOT_DIR}}/bootstrap/resources.yaml)
      echo "$output" | kubectl diff --filename - &>/dev/null \
      || echo "$output" | kubectl apply --server-side --filename -
