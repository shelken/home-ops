---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# 集群 Kopiur 快照与状态查看。恢复由备份组件声明完成，见 docs/11-kopiur.md。

vars:
  KOPIA_EXEC: kubectl exec -n kopiur-system deploy/kopia --
  KOPIUR_NS: kopiur-system
  REPLICATION: sakamoto-to-cloud

tasks:
  snapshots:
    desc: "列本地仓库 kopia 快照（云端见 docs/11-kopiur.md）。可选 APP=metatube（匹配 source 名）"
    silent: true
    vars:
      APP: '{{.APP | default ""}}'
    cmds:
      - |
        set -euo pipefail
        APP="{{.APP}}"
        if [ -n "$APP" ]; then
          echo "▶ snapshots matching APP=$APP"
          {{.KOPIA_EXEC}} kopia snapshot list --all 2>/dev/null | grep -i "$APP" || \
            echo "（无匹配；试 task kopiur:snapshots 看全量）"
        else
          echo "▶ all snapshots (cluster kopia)"
          {{.KOPIA_EXEC}} kopia snapshot list --all
        fi
    preconditions:
      - sh: which kubectl
        msg: "kubectl not found"
      - sh: kubectl get deploy kopia -n kopiur-system
        msg: "kopiur-system/kopia Deployment 不存在"

  status:
    desc: "看应用 Kopiur/工作负载状态。APP=… [NAMESPACE=default]"
    silent: true
    requires:
      vars: [APP]
    vars:
      NAMESPACE: '{{.NAMESPACE | default "default"}}'
    cmds:
      - |
        set -euo pipefail
        NS="{{.NAMESPACE}}"; APP="{{.APP}}"
        echo "=== ks/hr ==="
        kubectl get ks,hr -n "$NS" 2>/dev/null | grep -E "NAME|$APP" || true
        echo "=== pvc ==="
        kubectl get pvc -n "$NS" 2>/dev/null | grep -E "NAME|$APP|kopiur.*$APP" || true
        echo "=== snapshot ==="
        kubectl get snapshot -n "$NS" 2>/dev/null | grep -E "NAME|$APP" || true
        echo "=== snapshotschedule ==="
        kubectl get snapshotschedule -n "$NS" 2>/dev/null | grep -E "NAME|$APP" || true
        echo "=== restore ==="
        kubectl get restore -n "$NS" 2>/dev/null | grep -E "NAME|$APP" || true
        echo "=== pod ==="
        kubectl get pod -n "$NS" 2>/dev/null | grep -E "NAME|$APP" || true

  install-cli:
    desc: "通过 krew 安装 kubectl-kopiur 插件"
    silent: true
    cmds:
      - krew index add kopiur https://github.com/home-operations/kopiur.git 2>/dev/null || true
      - krew install kopiur
    preconditions:
      - sh: which krew
        msg: "需要先安装 krew（可通过 mise install 安装）"

  trigger:
    desc: "手动触发一次本地快照备份。APP=<app> [NAMESPACE=default] [WAIT=true]。云端异地副本见 task kopiur:replicate"
    silent: true
    requires:
      vars: [APP]
    vars:
      NAMESPACE: '{{.NAMESPACE | default "default"}}'
      WAIT: '{{.WAIT | default "true"}}'
    cmds:
      - |
        set -euo pipefail
        NS="{{.NAMESPACE}}"; APP="{{.APP}}"; POLICY="${APP}"
        echo "▶ 触发备份: namespace=$NS, policy=$POLICY"
        if which kubectl-kopiur >/dev/null 2>&1 || which kopiur >/dev/null 2>&1; then
          WAIT_FLAG=""
          if [ "{{.WAIT}}" = "true" ]; then
            WAIT_FLAG="--logs"
          fi
          kubectl kopiur snapshot now --policy "$POLICY" -n "$NS" $WAIT_FLAG
        else
          SNAP_NAME=$(cat <<EOF | kubectl create -f - -o jsonpath='{.metadata.name}'
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: Snapshot
        metadata:
          generateName: ${APP}-manual-
          namespace: ${NS}
        spec:
          policyRef:
            name: ${POLICY}
        EOF
          )
          echo "✔ 已生成 Snapshot CR: $SNAP_NAME"
          if [ "{{.WAIT}}" = "true" ]; then
            echo "▶ 正在等待快照完成 (Ctrl+C 可退出监听，后台继续运行)..."
            kubectl get snapshot -n "$NS" "$SNAP_NAME" -w
          fi
        fi

  replicate:
    desc: "手动触发一次异地复制（本地仓库 → 云端）。WAIT=false 只发起不等待"
    silent: true
    vars:
      WAIT: '{{.WAIT | default "true"}}'
    cmds:
      - |
        set -euo pipefail
        if which kubectl-kopiur >/dev/null 2>&1 || which kopiur >/dev/null 2>&1; then
          WAIT_FLAG=""
          if [ "{{.WAIT}}" = "true" ]; then
            WAIT_FLAG="--wait"
          fi
          kubectl kopiur replication run {{.REPLICATION}} -n {{.KOPIUR_NS}} --kind snapshot $WAIT_FLAG
        else
          kubectl annotate snapshotreplication {{.REPLICATION}} -n {{.KOPIUR_NS}} \
            "kopiur.home-operations.com/run-requested=$(date -u +%Y-%m-%dT%H:%M:%SZ)" --overwrite
          echo "✔ 已提交复制请求，进度见 status.manualRun"
          if [ "{{.WAIT}}" = "true" ]; then
            echo "▶ 正在等待复制完成 (Ctrl+C 可退出监听，后台继续运行)..."
            kubectl get snapshotreplication {{.REPLICATION}} -n {{.KOPIUR_NS}} -w
          fi
        fi
    preconditions:
      - sh: which kubectl
        msg: "kubectl not found"
      - sh: kubectl get snapshotreplication {{.REPLICATION}} -n {{.KOPIUR_NS}}
        msg: "kopiur-system/{{.REPLICATION}} SnapshotReplication 不存在（infra 未就绪？）"
