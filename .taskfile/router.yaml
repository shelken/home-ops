# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  # 各功能复用 → 不进 inv.sh
  ROUTER_SSH:
    sh: |
      ansible-inventory -i {{.ROOT_DIR}}/ansible/inventory/others.ini --host router-mine \
        | jq -re '.ansible_user + "@" + .ansible_host'
  BYPASS_SSH:
    sh: |
      ansible-inventory -i {{.ROOT_DIR}}/ansible/inventory/others.ini --host bypass-router \
        | jq -re '.ansible_user + "@" + .ansible_host'
  # home-ops 完整管理独立的 dnsmasq 配置目录
  DNS_MANAGED_CONF_DIR: "/etc/dnsmasq-home-ops.d"

tasks:
  bgp:diff:
    silent: true
    desc: "对比路由器运行中的 BIRD 配置与仓库版本"
    cmds:
      - task: _declare
        vars: {feature: bird, action: diff}

  bgp:sync:
    desc: "同步 BIRD 配置到路由器（先展示差异，确认后校验并热加载）"
    # deps 先于 prompt 执行：确认发生在看到差异之后
    deps: [bgp:diff]
    prompt: 将仓库版本下发到路由器 /etc/bird.conf 并热加载？
    cmds:
      - task: _declare
        vars: {feature: bird, action: sync}

  dae:diff:
    silent: true
    desc: "对比旁路由 dae 的二进制、init 脚本、配置与服务状态"
    cmds:
      - task: _declare
        vars: {feature: dae, action: diff, target: "{{.BYPASS_SSH}}"}

  dae:sync:
    desc: "同步旁路由 dae（先展示差异，确认后校验、下发、收敛服务并验证）"
    # deps 先于 prompt 执行：确认发生在看到差异之后
    deps: [dae:diff]
    prompt: 下发到旁路由；若要停 daed、启 dae，会中断所有经旁路由的出网，确认？
    cmds:
      - task: _declare
        vars: {feature: dae, action: sync, target: "{{.BYPASS_SSH}}"}

  _declare:
    internal: true
    dir: "{{.ROOT_DIR}}"
    requires:
      vars: ["feature", "action"]
    env:
      # 与顶层同名变量冲突时 task 级 env 会被覆盖（Task 3.53 实测），故另起名
      DECLARE_SSH: "{{.target | default .ROUTER_SSH}}"
    cmd: python3 router/declare.py {{.feature}} {{.action}}

  dns:diff:
    silent: true
    desc: "对比 home-ops 独占的 dnsmasq 配置目录"
    cmds:
      - task: _dns:declare
        vars: {action: diff}

  dns:sync:
    desc: "同步 home-ops 的 dnsmasq 配置（先展示差异，确认后校验并重启）"
    # deps 先于 prompt 执行：确认发生在看到差异之后
    deps: [dns:diff]
    prompt: 将 home-ops 配置下发到路由器并重启 dnsmasq？
    cmds:
      - task: _dns:declare
        vars: {action: sync}

  _dns:declare:
    internal: true
    dir: "{{.ROOT_DIR}}"
    requires:
      vars: ["action"]
    # 顶层 sh 变量对同文件所有 task 生效，因此只在真正需要它的 task 里解析
    vars:
      DNS_DOMAINS:
        sh: |
          set -euo pipefail
          sops -d {{.ROOT_DIR}}/k8s/components/common/sops/cluster-secret.sops.yaml \
            | yq -o=json '.stringData | {"MAIN_DOMAIN": .MAIN_DOMAIN, "INTERNAL_DOMAIN": .INTERNAL_DOMAIN}'
      MAIN_DOMAIN: '{{(fromJson .DNS_DOMAINS).MAIN_DOMAIN}}'
      INTERNAL_DOMAIN: '{{(fromJson .DNS_DOMAINS).INTERNAL_DOMAIN}}'
      DNS_GATEWAY:
        sh: >-
          yq ea -r 'select(.kind == "HelmRelease") | .spec.values.service.annotations."lbipam.cilium.io/ips"'
          {{.ROOT_DIR}}/k8s/infra/common/network/internal/k8s-gateway/app/helmrelease.yaml
    env:
      DECLARE_SSH: "{{.ROUTER_SSH}}"
      DNS_MANAGED_CONF_DIR: "{{.DNS_MANAGED_CONF_DIR}}"
      MAIN_DOMAIN: "{{.MAIN_DOMAIN}}"
      INTERNAL_DOMAIN: "{{.INTERNAL_DOMAIN}}"
      DNS_GATEWAY: "{{.DNS_GATEWAY}}"
    cmd: python3 router/declare.py dnsmasq {{.action}}

  run:
    internal: true
    silent: true
    requires:
      vars: ["router_cmd"]
    cmd: |
      ssh -n \
        -o BatchMode=yes \
        -o ConnectTimeout=5 \
        -o ServerAliveInterval=2 \
        -o ServerAliveCountMax=3 \
        {{ .ROUTER_SSH }} '{{ .router_cmd }}'

  restart-firewall:
    silent: true
    desc: 重启路由器 firewall（避免阻塞调用方）
    cmds:
      - task: run
        vars:
          router_cmd: >-
            /etc/init.d/firewall restart >/tmp/firewall-restart.log 2>&1 </dev/null &
