# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  # bgp:diff / bgp:sync 复用 → 不进 inv.sh
  ROUTER_SSH:
    sh: |
      ansible-inventory -i {{.ROOT_DIR}}/ansible/inventory/others.ini --host router-mine \
        | jq -re '.ansible_user + "@" + .ansible_host'
  BIRD_CONF: "{{.ROOT_DIR}}/router/bird/mine.conf"
  # 路由器上的落地路径只在这里声明一次；脚本按 env 消费，不再各留一份
  DNS_CONF_DIR: "/etc/dnsmasq.d"
  DNS_HOSTS_DST: "/etc/dnsmasq-hosts/int.hosts"
  # gateway 不可用时的顺序回落；gateway 自己的公网递归走 DoT
  DNS_FALLBACK: "223.5.5.5"

tasks:
  bgp:diff:
    silent: true
    desc: "对比路由器运行中的 BIRD 配置与仓库版本"
    cmds:
      - task: _bgp:diff

  _bgp:diff:
    internal: true
    silent: true
    cmd: |
      set -euo pipefail
      tmp="$(mktemp -t router-bird.conf)"
      trap 'rm -f "${tmp}"' EXIT

      ssh -n -o BatchMode=yes -o ConnectTimeout=5 {{ .ROUTER_SSH }} 'cat /etc/bird.conf' > "${tmp}"

      if git --no-pager diff --no-index --quiet -- "${tmp}" {{ .BIRD_CONF }}; then
        echo "路由器配置与仓库一致，无差异"
        exit 0
      fi

      # 左=路由器当前，右=仓库版本
      if command -v delta >/dev/null 2>&1; then
        git --no-pager diff --no-index --color=always -- "${tmp}" {{ .BIRD_CONF }} | delta --paging=never || true
      else
        git --no-pager diff --no-index --color=always -- "${tmp}" {{ .BIRD_CONF }} || true
      fi

  bgp:sync:
    desc: "同步 BIRD 配置到路由器（先展示差异，确认后校验并热加载）"
    # deps 先于 prompt 执行：确认发生在看到差异之后
    deps: [_bgp:diff]
    prompt: 将仓库版本下发到路由器 /etc/bird.conf 并热加载？
    cmds:
      - |
        set -euo pipefail
        scp -q -o BatchMode=yes {{ .BIRD_CONF }} {{ .ROUTER_SSH }}:/tmp/bird.conf.new
        ssh -n -o BatchMode=yes -o ConnectTimeout=5 {{ .ROUTER_SSH }} '
          set -e
          # 校验不过则清理临时文件并退出，/etc/bird.conf 保持原样
          trap "rm -f /tmp/bird.conf.new" EXIT
          bird -p -c /tmp/bird.conf.new || { echo "配置校验失败，/etc/bird.conf 未改动"; exit 1; }
          mv /tmp/bird.conf.new /etc/bird.conf
          birdc configure
          birdc show protocols
        '

  dns:diff:
    silent: true
    desc: "对比路由器 dnsmasq 声明（conf 目录与自举 hosts）与仓库版本"
    cmds:
      - task: _dns:declare
        vars: {action: diff}

  dns:bootstrap:
    desc: "一次性把 dnsmasq 切到仓库声明的 confdir（含清掉旧式 UCI hosts 与 allservers）"
    prompt: 把 dnsmasq 切到 {{ .DNS_CONF_DIR }} 并重启？
    cmd: |
      set -euo pipefail
      ssh -n -o BatchMode=yes -o ConnectTimeout=5 {{ .ROUTER_SSH }} '
        set -e

        # confdir 必须是纯配置文件目录：hosts 文件留在里面会被当配置解析，dnsmasq 起不来、整网断解析
        if [ -f {{ .DNS_CONF_DIR }}/int.hosts ]; then
          mkdir -p "$(dirname {{ .DNS_HOSTS_DST }})"
          mv {{ .DNS_CONF_DIR }}/int.hosts {{ .DNS_HOSTS_DST }}
          echo "旧 hosts 已移出 confdir：{{ .DNS_CONF_DIR }}/int.hosts -> {{ .DNS_HOSTS_DST }}"
        fi
        mkdir -p {{ .DNS_CONF_DIR }}

        # 旧 addnhosts 指向 confdir 内，与 20-hosts.conf 的 addn-hosts 指向同一批名字，重复注册会产生多个地址
        uci -q delete_list dhcp.@dnsmasq[0].addnhosts || uci -q delete dhcp.@dnsmasq[0].addnhosts || true

        # allservers 让所有上游同时被问，与声明里的 strict-order 相冲：公网答案会和内网答案竞速
        uci -q delete dhcp.@dnsmasq[0].allservers || true

        uci set dhcp.@dnsmasq[0].confdir={{ .DNS_CONF_DIR }}
        uci commit dhcp
        /etc/init.d/dnsmasq restart

        pidof dnsmasq >/dev/null || { echo "dnsmasq 没起来：检查 {{ .DNS_CONF_DIR }} 里是否混入了非配置文件"; exit 1; }
        nslookup openwrt.org 127.0.0.1 >/dev/null 2>&1 || { echo "本机解析失败：先看 logread | grep dnsmasq，不要继续"; exit 1; }
        echo "dnsmasq 已切到 {{ .DNS_CONF_DIR }}；下一步 task router:dns:sync 下发声明"
      '

  dns:sync:
    desc: "下发 dnsmasq 声明到路由器（先展示差异，确认后落地并重载）"
    # deps 先于 prompt 执行：确认发生在看到差异之后
    deps: [dns:diff]
    prompt: 将仓库声明下发到路由器并重载 dnsmasq？
    cmds:
      - task: _dns:declare
        vars: {action: sync}

  _dns:declare:
    internal: true
    dir: "{{.ROOT_DIR}}"
    requires:
      vars: ["action"]
    # 顶层 sh 变量对同文件所有 task 生效，因此只在真正需要它的 task 里解析
    vars:
      DNS_DOMAINS:
        sh: |
          set -euo pipefail
          sops -d {{.ROOT_DIR}}/k8s/components/common/sops/cluster-secret.sops.yaml \
            | yq -o=json '.stringData | {"MAIN_DOMAIN": .MAIN_DOMAIN, "INTERNAL_DOMAIN": .INTERNAL_DOMAIN}'
      MAIN_DOMAIN: '{{(fromJson .DNS_DOMAINS).MAIN_DOMAIN}}'
      INTERNAL_DOMAIN: '{{(fromJson .DNS_DOMAINS).INTERNAL_DOMAIN}}'
      DNS_GATEWAY:
        sh: >-
          yq ea -r 'select(.kind == "HelmRelease") | .spec.values.service.annotations."lbipam.cilium.io/ips"'
          {{.ROOT_DIR}}/k8s/infra/common/network/internal/k8s-gateway/app/helmrelease.yaml
    env:
      ROUTER_SSH: "{{.ROUTER_SSH}}"
      DNS_CONF_DIR: "{{.DNS_CONF_DIR}}"
      DNS_HOSTS_DST: "{{.DNS_HOSTS_DST}}"
      MAIN_DOMAIN: "{{.MAIN_DOMAIN}}"
      INTERNAL_DOMAIN: "{{.INTERNAL_DOMAIN}}"
      DNS_GATEWAY: "{{.DNS_GATEWAY}}"
      DNS_FALLBACK: "{{.DNS_FALLBACK}}"
    cmd: python3 router/dnsmasq/declare.py {{.action}}

  run:
    internal: true
    silent: true
    requires:
      vars: ["router_cmd"]
    cmd: |
      ssh -n \
        -o BatchMode=yes \
        -o ConnectTimeout=5 \
        -o ServerAliveInterval=2 \
        -o ServerAliveCountMax=3 \
        {{ .ROUTER_SSH }} '{{ .router_cmd }}'

  restart-firewall:
    silent: true
    desc: 重启路由器 firewall（避免阻塞调用方）
    cmds:
      - task: run
        vars:
          router_cmd: >-
            /etc/init.d/firewall restart >/tmp/firewall-restart.log 2>&1 </dev/null &
