# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  # bgp:diff / bgp:sync 复用 → 不进 inv.sh
  ROUTER_SSH:
    sh: |
      ansible-inventory -i {{.ROOT_DIR}}/ansible/inventory/others.ini --host router-mine \
        | jq -re '.ansible_user + "@" + .ansible_host'
  BYPASS_SSH:
    sh: |
      ansible-inventory -i {{.ROOT_DIR}}/ansible/inventory/others.ini --host hk1-router \
        | jq -re '.ansible_user + "@" + .ansible_host'
  BIRD_CONF: "{{.ROOT_DIR}}/router/bird/mine.conf"
  # home-ops 完整管理独立的 dnsmasq 配置目录
  DNS_MANAGED_CONF_DIR: "/etc/dnsmasq-home-ops.d"
  DARKSTAT_CONF: "{{.ROOT_DIR}}/router/darkstat/darkstat.config"
  DARKSTAT_DAE0_INIT: "{{.ROOT_DIR}}/router/darkstat/darkstat-dae0.init"

tasks:
  bgp:diff:
    silent: true
    desc: "对比路由器运行中的 BIRD 配置与仓库版本"
    cmds:
      - task: _bgp:diff

  _bgp:diff:
    internal: true
    silent: true
    cmd: |
      set -euo pipefail
      tmp="$(mktemp -t router-bird.conf)"
      trap 'rm -f "${tmp}"' EXIT

      ssh -n -o BatchMode=yes -o ConnectTimeout=5 {{ .ROUTER_SSH }} 'cat /etc/bird.conf' > "${tmp}"

      if git --no-pager diff --no-index --quiet -- "${tmp}" {{ .BIRD_CONF }}; then
        echo "路由器配置与仓库一致，无差异"
        exit 0
      fi

      # 左=路由器当前，右=仓库版本
      if command -v delta >/dev/null 2>&1; then
        git --no-pager diff --no-index --color=always -- "${tmp}" {{ .BIRD_CONF }} | delta --paging=never || true
      else
        git --no-pager diff --no-index --color=always -- "${tmp}" {{ .BIRD_CONF }} || true
      fi

  bgp:sync:
    desc: "同步 BIRD 配置到路由器（先展示差异，确认后校验并热加载）"
    # deps 先于 prompt 执行：确认发生在看到差异之后
    deps: [_bgp:diff]
    prompt: 将仓库版本下发到路由器 /etc/bird.conf 并热加载？
    cmds:
      - |
        set -euo pipefail
        scp -q -o BatchMode=yes {{ .BIRD_CONF }} {{ .ROUTER_SSH }}:/tmp/bird.conf.new
        ssh -n -o BatchMode=yes -o ConnectTimeout=5 {{ .ROUTER_SSH }} '
          set -e
          # 校验不过则清理临时文件并退出，/etc/bird.conf 保持原样
          trap "rm -f /tmp/bird.conf.new" EXIT
          bird -p -c /tmp/bird.conf.new || { echo "配置校验失败，/etc/bird.conf 未改动"; exit 1; }
          mv /tmp/bird.conf.new /etc/bird.conf
          birdc configure
          birdc show protocols
        '

  dns:diff:
    silent: true
    desc: "对比 home-ops 独占的 dnsmasq 配置目录"
    cmds:
      - task: _dns:declare
        vars: {action: diff}

  dns:sync:
    desc: "同步 home-ops 的 dnsmasq 配置（先展示差异，确认后校验并重启）"
    # deps 先于 prompt 执行：确认发生在看到差异之后
    deps: [dns:diff]
    prompt: 将 home-ops 配置下发到路由器并重启 dnsmasq？
    cmds:
      - task: _dns:declare
        vars: {action: sync}

  darkstat:diff:
    silent: true
    desc: "对比路由器运行中的 darkstat 配置与仓库版本"
    cmds:
      - task: _darkstat:diff

  _darkstat:diff:
    internal: true
    silent: true
    cmd: |
      set -euo pipefail
      tmp="$(mktemp -t router-darkstat.config)"
      trap 'rm -f "${tmp}"' EXIT

      ssh -n -o BatchMode=yes -o ConnectTimeout=5 {{ .ROUTER_SSH }} 'cat /etc/config/darkstat 2>/dev/null || true' > "${tmp}"

      if git --no-pager diff --no-index --quiet -- "${tmp}" {{ .DARKSTAT_CONF }}; then
        echo "路由器 darkstat 配置与仓库一致，无差异"
        exit 0
      fi

      if command -v delta >/dev/null 2>&1; then
        git --no-pager diff --no-index --color=always -- "${tmp}" {{ .DARKSTAT_CONF }} | delta --paging=never || true
      else
        git --no-pager diff --no-index --color=always -- "${tmp}" {{ .DARKSTAT_CONF }} || true
      fi

  darkstat:sync:
    desc: "同步 darkstat 配置到路由器（先展示差异，确认后下发并重启）"
    deps: [_darkstat:diff]
    prompt: 将仓库版本下发到路由器 /etc/config/darkstat 并重启 darkstat？
    cmds:
      - |
        set -euo pipefail
        scp -q -o BatchMode=yes {{ .DARKSTAT_CONF }} {{ .ROUTER_SSH }}:/tmp/darkstat.config.new
        ssh -n -o BatchMode=yes -o ConnectTimeout=5 {{ .ROUTER_SSH }} '
          set -e
          mv /tmp/darkstat.config.new /etc/config/darkstat
          /etc/init.d/darkstat restart
          sleep 1
          /etc/init.d/darkstat status | grep -q "running" || { echo "darkstat 启动异常"; exit 1; }
          echo "✅ darkstat 配置已同步并成功重启"
        '

  darkstat-dae0:diff:
    silent: true
    desc: "对比旁路由 darkstat-dae0 init 脚本与仓库版本"
    cmds:
      - task: _darkstat-dae0:diff

  _darkstat-dae0:diff:
    internal: true
    silent: true
    cmd: |
      set -euo pipefail
      tmp="$(mktemp -t router-darkstat-dae0.init)"
      trap 'rm -f "${tmp}"' EXIT

      ssh -n -o BatchMode=yes -o ConnectTimeout=5 {{ .BYPASS_SSH }} 'cat /etc/init.d/darkstat-dae0 2>/dev/null || true' > "${tmp}"
      chmod +x "${tmp}"  # init 脚本含执行位，mktemp 默认 0600 会让 diff 永远误报 mode 差异

      if git --no-pager diff --no-index --quiet -- "${tmp}" {{ .DARKSTAT_DAE0_INIT }}; then
        echo "旁路由 darkstat-dae0 与仓库一致，无差异"
        exit 0
      fi

      if command -v delta >/dev/null 2>&1; then
        git --no-pager diff --no-index --color=always -- "${tmp}" {{ .DARKSTAT_DAE0_INIT }} | delta --paging=never || true
      else
        git --no-pager diff --no-index --color=always -- "${tmp}" {{ .DARKSTAT_DAE0_INIT }} || true
      fi

  darkstat-dae0:sync:
    desc: "同步 darkstat-dae0 到旁路由（先展示差异，确认后安装依赖、下发并启用）"
    deps: [_darkstat-dae0:diff]
    prompt: 将仓库版本下发到旁路由 /etc/init.d/darkstat-dae0 并重启服务？
    cmds:
      - |
        set -euo pipefail
        scp -q -o BatchMode=yes {{ .DARKSTAT_DAE0_INIT }} {{ .BYPASS_SSH }}:/tmp/darkstat-dae0.init.new
        ssh -n -o BatchMode=yes -o ConnectTimeout=5 {{ .BYPASS_SSH }} '
          set -e
          opkg list-installed darkstat >/dev/null 2>&1 || opkg install darkstat >/dev/null
          mv /tmp/darkstat-dae0.init.new /etc/init.d/darkstat-dae0
          chmod +x /etc/init.d/darkstat-dae0
          /etc/init.d/darkstat-dae0 enable
          /etc/init.d/darkstat-dae0 restart
          sleep 1
          /etc/init.d/darkstat-dae0 status | grep -q running || { echo "darkstat-dae0 启动异常"; exit 1; }
          echo "✅ darkstat-dae0 已同步并成功运行"
        '

  _dns:declare:
    internal: true
    dir: "{{.ROOT_DIR}}"
    requires:
      vars: ["action"]
    # 顶层 sh 变量对同文件所有 task 生效，因此只在真正需要它的 task 里解析
    vars:
      DNS_DOMAINS:
        sh: |
          set -euo pipefail
          sops -d {{.ROOT_DIR}}/k8s/components/common/sops/cluster-secret.sops.yaml \
            | yq -o=json '.stringData | {"MAIN_DOMAIN": .MAIN_DOMAIN, "INTERNAL_DOMAIN": .INTERNAL_DOMAIN}'
      MAIN_DOMAIN: '{{(fromJson .DNS_DOMAINS).MAIN_DOMAIN}}'
      INTERNAL_DOMAIN: '{{(fromJson .DNS_DOMAINS).INTERNAL_DOMAIN}}'
      DNS_GATEWAY:
        sh: >-
          yq ea -r 'select(.kind == "HelmRelease") | .spec.values.service.annotations."lbipam.cilium.io/ips"'
          {{.ROOT_DIR}}/k8s/infra/common/network/internal/k8s-gateway/app/helmrelease.yaml
    env:
      ROUTER_SSH: "{{.ROUTER_SSH}}"
      DNS_MANAGED_CONF_DIR: "{{.DNS_MANAGED_CONF_DIR}}"
      MAIN_DOMAIN: "{{.MAIN_DOMAIN}}"
      INTERNAL_DOMAIN: "{{.INTERNAL_DOMAIN}}"
      DNS_GATEWAY: "{{.DNS_GATEWAY}}"
    cmd: python3 router/dnsmasq/declare.py {{.action}}

  run:
    internal: true
    silent: true
    requires:
      vars: ["router_cmd"]
    cmd: |
      ssh -n \
        -o BatchMode=yes \
        -o ConnectTimeout=5 \
        -o ServerAliveInterval=2 \
        -o ServerAliveCountMax=3 \
        {{ .ROUTER_SSH }} '{{ .router_cmd }}'

  restart-firewall:
    silent: true
    desc: 重启路由器 firewall（避免阻塞调用方）
    cmds:
      - task: run
        vars:
          router_cmd: >-
            /etc/init.d/firewall restart >/tmp/firewall-restart.log 2>&1 </dev/null &
