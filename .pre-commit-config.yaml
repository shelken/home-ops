# 由 prek 执行的钩子配置（沿用 pre-commit 兼容的 YAML 格式）。
# 纯文本检查用 `repo: builtin`（prek 原生实现，离线、不克隆仓库、不建环境）。
# 其余检查复用 mise.toml 已装的工具，故仍为 `repo: local` + `language: system`。
default_stages:
  - pre-commit

repos:
  - repo: builtin
    hooks:
      - id: check-merge-conflict
        types: [text]

      - id: end-of-file-fixer
        types: [text]

      - id: trailing-whitespace
        types: [text]

  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: yamllint --config-file .yamllint
        language: system
        types: [yaml]

      - id: ruff
        name: ruff
        entry: ruff check --no-cache
        language: system
        types: [python]

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]

      - id: markdown-relative-links
        name: markdown-relative-links
        entry: python3 scripts/check-markdown-links.py
        language: system
        types: [markdown]

      - id: gitleaks
        name: gitleaks
        entry: gitleaks protect --staged --config gitleaks.toml --redact -v
        language: system
        pass_filenames: false
