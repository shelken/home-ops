---
# 整集群关停：只优雅关 node，不先 stop k3s
#
# 原因（2026-08-01 事故）：先 systemctl stop k3s 再断电，会在卷仍挂载时
# 干掉 Longhorn 引擎 → poweroff 时 device offline + lost sync + /mnt/lima-longhorn
# umount busy → 脏盘；lima 脏盘误 mkfs 可毁掉数据盘。
# 直接 qm shutdown / limactl stop，由 guest systemd 按依赖停服务再 umount。
#
# 不做 drain/cordon（整集群下电无处可迁，且撞 Longhorn/CNPG PDB）
# 不做 limactl stop -f / qm stop 默认强杀（强杀 = 脏盘）
#
# 用法（需同时加载 k8s 节点与 pve/sakamoto）:
#   cd ansible
#   ansible-playbook -i inventory/hosts.ini -i inventory/others.ini playbooks/cluster-stop.yml
#
# 顺序: PVE qm shutdown workers → limactl stop CP

- name: Shutdown worker VMs on PVE
  hosts: pve
  gather_facts: false
  vars:
    cluster_qm_wait_retries: 60
    cluster_qm_wait_delay: 3
  tasks:
    - name: Graceful shutdown each worker VM
      ansible.builtin.shell: |
        set -euo pipefail
        vmid="$(qm list | awk -v name="{{ item }}" '$2 == name {print $1}')"
        if [ -z "${vmid}" ]; then
          echo "ERROR: no PVE VM named {{ item }}" >&2
          exit 1
        fi
        st="$(qm status "${vmid}")"
        echo "{{ item }} vmid=${vmid} ${st}"
        if echo "${st}" | grep -q "status: stopped"; then
          echo "already stopped"
          exit 0
        fi
        qm shutdown "${vmid}" --timeout 120
        for i in $(seq 1 {{ cluster_qm_wait_retries }}); do
          st="$(qm status "${vmid}")"
          echo "  [${i}] ${st}"
          if echo "${st}" | grep -q "status: stopped"; then
            exit 0
          fi
          sleep {{ cluster_qm_wait_delay }}
        done
        echo "ERROR: {{ item }} (vmid=${vmid}) did not stop after graceful shutdown; refuse qm stop (force = dirty disk)" >&2
        exit 1
      args:
        executable: /bin/bash
      loop: "{{ groups['workers'] | default([]) }}"
      loop_control:
        label: "{{ item }}"

- name: Stop control-plane Lima VM
  hosts: sakamoto
  gather_facts: false
  vars:
    lima_vm: "{{ groups['controllers'][0] }}"
    cluster_lima_wait_retries: 60
    cluster_lima_wait_delay: 3
  tasks:
    - name: Graceful limactl stop
      ansible.builtin.shell: |
        set -euo pipefail
        vm="{{ lima_vm }}"
        st="$(limactl list | awk -v vm="${vm}" '$1 == vm { print $2; exit }')"
        if [ -z "${st}" ]; then
          echo "Lima instance ${vm} not found" >&2
          exit 1
        fi
        if [ "${st}" = "Stopped" ]; then
          echo "already stopped"
          exit 0
        fi
        # 禁止 stop -f：强杀会跳过 guest umount，Longhorn 数据盘必脏
        limactl stop "${vm}"
        for i in $(seq 1 {{ cluster_lima_wait_retries }}); do
          st="$(limactl list | awk -v vm="${vm}" '$1 == vm { print $2; exit }')"
          echo "  [${i}] ${st}"
          if [ "${st}" = "Stopped" ]; then
            exit 0
          fi
          sleep {{ cluster_lima_wait_delay }}
        done
        echo "ERROR: ${vm} did not reach Stopped after limactl stop; refuse stop -f (force = dirty disk)" >&2
        exit 1
      args:
        executable: /bin/bash
