---
# 刷新本地 kubeconfig (~/.kube/home-ops.yaml)
#
# 用法:
#   ansible-playbook ansible/playbooks/kubeconfig.yaml
#   或通过 task: task cluster:kubeconfig

- name: 检查 controllers 节点
  hosts: localhost
  gather_facts: false
  tasks:
    - name: 校验 controllers 分组非空
      ansible.builtin.assert:
        that:
          - groups['controllers'] is defined
          - groups['controllers'] | length > 0
        fail_msg: "Inventory 中缺少 'controllers' 分组或分组为空，无法获取 kubeconfig"

- name: 从 primary control-plane 刷新 kubeconfig
  hosts: controllers
  become: true
  gather_facts: false
  tasks:
    - name: 同步 kubeconfig
      ansible.builtin.include_tasks: tasks/kubeconfig.yaml
