---
- name: Check if chrony is installed
  ansible.builtin.shell: dpkg -l chrony 2>/dev/null | grep -q "^ii"
  register: chrony_installed
  changed_when: false
  failed_when: false

- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present
  when: chrony_installed.rc != 0

- name: Configure chrony with Aliyun NTP servers
  ansible.builtin.blockinfile:
    path: /etc/chrony/chrony.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK: ALIYUN NTP"
    block: |
      server ntp.aliyun.com iburst
      server ntp1.aliyun.com iburst
    backup: yes
  notify: restart chrony

- name: 大偏移任何时候立即步进而非慢速 slew
  # Lima VM 随 macOS 睡眠暂停后恢复，以及 RTC 异常启动（曾出现 2121 年），
  # 时钟可瞬间偏差巨大；Ubuntu 默认 makestep 1 3 只覆盖启动后前 3 次更新。
  # Go 运行时定时器走单调钟，步进墙钟不影响 etcd 选主（election-timeout 已上调至 5s）
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    regexp: '^makestep .*$'
    line: 'makestep 1 -1'
    backup: yes
  notify: restart chrony

- name: Check if lima-guestagent exists
  ansible.builtin.stat:
    path: /usr/local/bin/lima-guestagent
  register: lima_guestagent

- name: Prevent lima-guestagent from writing system clock
  # guestagent 每 10s 与宿主对时，偏差 >100ms 直接 settimeofday；
  # 该调用清除内核 NTP 同步状态（STA_UNSYNC + maxerror 16s），
  # 与 chrony 互相毒化形成振荡，触发 NodeClockNotSynchronising。
  # 只剥离 CAP_SYS_TIME，保留端口转发等其余功能。
  when: lima_guestagent.stat.exists
  block:
    - name: Create lima-guestagent drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/lima-guestagent.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy lima-guestagent capability drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/system/lima-guestagent.service.d/90-no-sys-time.conf
        content: |
          [Service]
          CapabilityBoundingSet=~CAP_SYS_TIME
        owner: root
        group: root
        mode: "0644"
      notify:
        - restart lima-guestagent
        - reset chrony frequency state

- name: Ensure chrony is enabled and started
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: yes

- name: Check if systemd-timesyncd exists
  ansible.builtin.shell: systemctl list-unit-files | grep -q systemd-timesyncd
  register: timesyncd_exists
  changed_when: false
  failed_when: false

- name: Disable and stop systemd-timesyncd
  ansible.builtin.service:
    name: systemd-timesyncd
    state: stopped
    enabled: no
  when: timesyncd_exists.rc == 0
