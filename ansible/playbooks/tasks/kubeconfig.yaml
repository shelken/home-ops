---
- name: Verify controllers group exists and is non-empty
  ansible.builtin.assert:
    that:
      - groups['controllers'] is defined
      - groups['controllers'] | length > 0
    fail_msg: "Inventory 中缺少 'controllers' 分组或分组为空，无法获取 kubeconfig"
  run_once: true

- name: Set primary control plane host and local kubeconfig paths
  ansible.builtin.set_fact:
    k3s_primary_control_host: "{{ groups['controllers'][0] }}"
    local_kube_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube"
    local_kubeconfig_path: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/home-ops.yaml"

- name: Verify k3s_registration_address is defined
  ansible.builtin.assert:
    that:
      - hostvars[k3s_primary_control_host]['k3s_registration_address'] is defined or k3s_registration_address is defined
    fail_msg: "未定义 k3s_registration_address，无法设置 kubeconfig server 地址"
  run_once: true

- name: Set server registration address
  ansible.builtin.set_fact:
    k3s_server_address: "{{ hostvars[k3s_primary_control_host]['k3s_registration_address'] | default(k3s_registration_address) }}"

- name: Ensure local ~/.kube directory exists with 0700 permissions
  ansible.builtin.file:
    path: "{{ local_kube_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Fetch kubeconfig from primary control plane
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ local_kubeconfig_path }}"
    flat: true
  when: inventory_hostname == k3s_primary_control_host
  become: true

- name: Ensure local kubeconfig file has 0600 permissions
  ansible.builtin.file:
    path: "{{ local_kubeconfig_path }}"
    state: file
    mode: "0600"
  delegate_to: localhost
  become: false
  run_once: true

- name: Update server address in local kubeconfig
  ansible.builtin.replace:
    path: "{{ local_kubeconfig_path }}"
    regexp: https://127.0.0.1:6443
    replace: "https://{{ k3s_server_address }}:6443"
    mode: "0600"
  delegate_to: localhost
  become: false
  run_once: true
  register: kubeconfig_server_update

- name: Verify server address was updated
  ansible.builtin.assert:
    that:
      - kubeconfig_server_update.changed
    fail_msg: "kubeconfig 中未找到预期的 https://127.0.0.1:6443 server 地址"
  run_once: true
