---
# LAN 配置 — 只有 PVE 节点需要 Ansible 介入
#
# Lima 节点的 ethernets 配置完全归 Lima 与 cloud-init 管：
#   - 接口命名：cloud-init 的 50-cloud-init.yaml（match macaddress + set-name eth0/eth1）
#   - 寻址与 route-metric：Lima networks[].metric 生成（bridged=100，内置 SLIRP=200）
# Ansible 只做 DNS（k8s-dns.yaml）与 VLAN（k8s-vlan.yaml），不碰 Lima 的 ethernets。
# 理由见 docs/adr/0001-lima-network-ownership.md。

- name: "PVE: 恢复 cloud-init 网络"
  ansible.builtin.file:
    path: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    state: absent
  when: is_pve
  notify: Reapply cloud-init network

- name: "PVE: 清理 Ansible 残留 netplan"
  ansible.builtin.file:
    path: /etc/netplan/50-node-network.yaml
    state: absent
  when: is_pve
  notify: Apply netplan
