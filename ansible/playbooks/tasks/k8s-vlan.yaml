---
# VLAN — netplan 持久化，变量驱动

- name: 写入 VLAN netplan
  ansible.builtin.copy:
    dest: /etc/netplan/60-vlan.yaml
    mode: "0600"
    content: |
      network:
        version: 2
        vlans:
      {% for vid in k8s_vlan_ids %}
          {{ k8s_vlan_parent }}.{{ vid }}:
            id: {{ vid }}
            link: {{ k8s_vlan_parent }}
      {% endfor %}
  notify: Apply netplan
