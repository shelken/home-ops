# 集群外主机（taskfile inv.sh + 少量 ansible playbook）
# k8s 节点见 hosts.ini
#
# 分组约定（重要）:
#   vps          — 仅 SSH/运维；配置由 nix-config 声明，不接受 ansible 配置
#   hypervisor   — 仅 SSH/运维（PVE），禁止全量 bootstrap
#   endpoint     — 仅 SSH/运维（Mac 宿主机等），禁止全量 bootstrap
#   router       — 仅 SSH/运维（主路由与旁路由），配置由 nix-config 声明
#   playbook 禁止 hosts=all

[vps]
vps-cc ansible_host=vps-cc

[hypervisor]
pve ansible_host=pve

[endpoint]
# Mac 宿主机（Lima / lms）
# .lan 解析在本机可能被 fake-ip 代理污染（返回 198.18.x.x），SSH 一律用内网 IP
sakamoto ansible_host=192.168.6.144 ansible_user=shelken
yuuko ansible_host=192.168.6.11 ansible_user=shelken

[router]
router-mine ansible_host=192.168.6.1
# 旁路由（hk1box，NixOS 上的 sing-box）
bypass-router ansible_host=192.168.6.3

[vps:vars]
ansible_user=root

[hypervisor:vars]
ansible_user=root

[router:vars]
ansible_user=root

[all:vars]
ansible_python_interpreter=/usr/bin/python3
