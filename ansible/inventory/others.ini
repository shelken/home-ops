# 集群外主机（taskfile inv.sh + 少量 ansible playbook）
# k8s 节点见 hosts.ini
#
# 分组约定（重要）:
#   vps          — 允许 site-others / ufw 等 bootstrap 的 Linux VPS
#   hypervisor   — 仅 SSH/运维（PVE），禁止全量 bootstrap
#   endpoint     — 仅 SSH/运维（Mac 宿主机等），禁止全量 bootstrap
#   router       — 仅 SSH/运维（OpenWrt），禁止全量 bootstrap
#   mach         — 以上并集，供「枚举机器」；playbook 禁止 hosts=mach/all

[vps]
vps-cc ansible_host=vps-cc

[hypervisor]
pve ansible_host=pve

[endpoint]
# Mac 宿主机（Lima / compose / lms）
# .lan 解析在本机可能被 fake-ip 代理污染（返回 198.18.x.x），SSH 一律用内网 IP
sakamoto ansible_host=192.168.6.144 ansible_user=shelken
yuuko ansible_host=192.168.6.10 ansible_user=shelken

[router]
router-mine ansible_host=192.168.6.1

[vps:vars]
ansible_user=root

[hypervisor:vars]
ansible_user=root

[router:vars]
ansible_user=root

# 枚举用并集；不要对 mach 跑 hosts=all 式配置
[mach:children]
vps
hypervisor
endpoint

[all:vars]
ansible_python_interpreter=/usr/bin/python3
