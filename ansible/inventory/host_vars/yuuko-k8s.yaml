# Lima VM on M1 Mac Mini (yuuko), on the same LAN as the other k3s hosts
# 桥接 MAC 52:55:55:37:34:57 在路由器上做了 DHCP 保留 → 192.168.6.81
# lima_host: cluster-start/stop 按此走 Lima 分支而非 PVE qm
lima_host: yuuko

remote_node: false

# 本地节点沿用集群 registry 配置，只拒绝 IPv6 DNS。
setup_dns: true

# 声明式节点标签（节点重建后 install-k3s 自动恢复）。
# lightweight = 轻量弹性节点：可停机、不参与 Longhorn 存储（#1432），
# 供业务 preferred 亲和与 generic-device-plugin 等 DS 的 NotIn 排除引用。
k3s_node_labels:
  - "node-type=lightweight"
