---
# 集群外 Linux VPS 初始化。
# 库存: -i ansible/inventory/others.ini
# 目标: 仅 [vps]（不含 hypervisor / endpoint / router）
# 即使忘记 --limit，也不会打到 sakamoto / pve / router-mine。

- name: 准备 VPS 节点
  hosts: vps
  become: true
  tasks:
    - name: 设置主机名为 "{{ inventory_hostname }}"
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: 设置时区
      community.general.timezone:
        name: "{{ system_timezone }}"

    - name: 换源
      ansible.builtin.import_tasks: playbooks/tasks/change-sources.yaml

    - name: install system pkgs
      ansible.builtin.apt:
        name: "{{ system_packages }}"
        state: present

    - name: 安装 Docker
      ansible.builtin.import_tasks: playbooks/tasks/install-docker.yaml

    - name: 安装 Tailscale
      ansible.builtin.import_tasks: playbooks/tasks/install-tailscale.yaml

    - name: 安装 Oh My Zsh
      ansible.builtin.import_tasks: playbooks/tasks/install-ohmyzsh.yaml

- name: VPS sysctl
  hosts: vps
  become: true
  gather_facts: false
  tasks:
    - name: 设置 sysctl
      ansible.builtin.include_tasks: playbooks/tasks/sysctl.yaml

- name: VPS UFW
  ansible.builtin.import_playbook: playbooks/ufw-vps.yml

- name: 配置 SSH
  hosts: vps
  become: true
  gather_facts: false
  tasks:
    - name: 配置 SSH
      ansible.builtin.include_tasks: playbooks/tasks/ssh.yaml
