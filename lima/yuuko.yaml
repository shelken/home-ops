#ref: https://github.com/lima-vm/lima/blob/master/templates/default.yaml
# Local node on the same LAN as the other k3s hosts

env:
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""

cpus: 6
memory: 8G
disk: 40G

# No additional disks available on yuuko
# additionalDisks:
#   - "longhorn"

ssh:
  localPort: 60123

hostResolver:
  enabled: false

# https://lima-vm.io/docs/config/network/vmnet/
# 桥接前置（缺一不可）：
#   1. 宿主以 root 拥有方式安装 socket_vmnet 到 /opt/socket_vmnet，并写入 sudoers 与按网口建的 launchd daemon
#      （brew install 的路径会被 Lima 拒绝，步骤见 socket_vmnet 仓库 README 的 Install 与 Bridged mode 两节）
#   2. $LIMA_HOME/_config/networks.yaml 的 bridged.interface 指向宿主的**有线**网口
#      （macOS 不支持用无线网卡做桥接，见知识库 lima-macos-bridged-network）
networks:
  - lima: bridged
    interface: eth1
    macAddress: "52:55:55:37:34:57"
    metric: 100

portForwards:
  - ignore: true
    proto: any
    guestPort: 443
    guestIP: 0.0.0.0
  - ignore: true
    proto: any
    guestPort: 80
    guestIP: 0.0.0.0

images:
  # 固定版本 + digest，只下载一次，后续复用缓存
  - location: "https://cloud-images.ubuntu.com/releases/noble/release-20260518/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
    digest: "sha256:53fdde898feed8b027d94baa9cfe8229867f330a1d9c49dc7d84465ee7f229f7"
  - location: "https://cloud-images.ubuntu.com/releases/noble/release-20260518/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
    digest: "sha256:6a61b967ba4a27dd1966f835a67643073ed55c2860ce3dc1cb0517282e6b8bec"
  # 回退——不带 digest，跟随上游滚动
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"

# containerd is managed by k3s, not by Lima
containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      # 只清理 Lima 自己的历史遗留静态配置。
      # 不准删 50-cloud-init.yaml：那是 Lima/cloud-init 生成的 eth0/eth1 寻址基线，
      # 删除后 guest 所有网口失去 DHCP，Ansible 尚未接管前节点彻底失联。
      # 网络最终由 Ansible 的 50-node-network.yaml 接管。
      rm -f /etc/netplan/99-eth1.yaml /etc/netplan/90-eth1.yaml
      netplan apply || true
      # Lima cidata 20-rootless-base.sh 无条件 loginctl enable-linger，
      # 但本机 k3s 用 root containerd，不需要 rootless user manager 常驻。
      # 关闭 linger 避免 systemd 255 mountinfo churn 堆积内存（见 postmortem 015、issue #1301）。
      loginctl disable-linger shelken 2>/dev/null || true

      # 关闭 mDNS（issue #1471）：Lima cidata 的 06-enable-mdns-on-systemd.sh
      # 每次开机对 resolvectl status 列出的**所有**网卡执行 resolvectl mdns <iface> yes，
      # 而本 guest 有 60 个 link（含 cilium_host / lxc* / veth / VLAN 子接口）。
      # guest 在本网段宣告 <hostname>.local 后，路由器 Avahi reflector
      # （跨 br-lan.6 <-> br-lan.50，check-response-ttl=no）会把它反射回同一广播域，
      # systemd-resolved 收到指向自身 IP 的记录后误判名字被占用，不断改名重播
      # （历史计数器已累积到 16 万级）。
      # systemd 的 mDNS 生效值 = min(per-link, global)，per-link 压不过 Lima 每次开机
      # 的重放，故只有把全局位置为 no 才能从 AND 门源头关停。
      # 本 provision 在 boot.Linux/*.sh 之后执行，写入后重启 resolved 即生效。
      # 节点间与集群内通信用 IP 与 *.svc.cluster.local，不依赖 mDNS。
      install -d -m 755 /etc/systemd/resolved.conf.d
      printf '[Resolve]\nMulticastDNS=no\n' > /etc/systemd/resolved.conf.d/99-disable-mdns.conf
      systemctl restart systemd-resolved 2>/dev/null || true

      # 注入 mio 的公钥。
      # 不能用 Lima 的 ssh.loadDotSSHPubKeys：它注入的是**宿主**的 ~/.ssh/*.pub，
      # 而本机宿主的密钥与 mio 不是同一把，Ansible/ssh 从 mio 直连 guest 仍会被拒。
      # 用 getent 取家目录，避免写死 /home/<user>（Ubuntu cloud image 用 shelken.guest）。
      # 幂等：已存在则不重复追加。
      pubkey='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN9sMBAahOZKZ5QXBEsu6ACfgX8TSt5EgD+E1h6mtzG2 shelken@mio'
      home_dir="$(getent passwd shelken | cut -d: -f6)"
      install -d -m 700 -o shelken -g shelken "$home_dir/.ssh"
      touch "$home_dir/.ssh/authorized_keys"
      grep -qxF "$pubkey" "$home_dir/.ssh/authorized_keys" \
        || echo "$pubkey" >> "$home_dir/.ssh/authorized_keys"
      chmod 600 "$home_dir/.ssh/authorized_keys"
      chown shelken:shelken "$home_dir/.ssh/authorized_keys"

probes: []
copyToHost: []
