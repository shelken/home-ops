# Recovery VM — 单次恢复群晖磁盘数据用
# 参考：sakamoto.yaml
# 需要 Lima HEAD (v2.2.0-dev) 以上才支持 blockDevices

vmType: "vz"

cpus: 2
memory: 2G
disk: 20G

# 群晖残盘直通
# 插盘后先确认设备号：diskutil list external physical
# 这里以 /dev/disk6 为例，实际启动时替换或改 YAML
blockDevices:
  - /dev/disk6

ssh:
  localPort: 60124

hostResolver:
  enabled: false

images:
  # 固定到 20260927 版本 + digest，避免每次对比上游最新并重下
  # 全仓库统一 Ubuntu 26.04（resolute）：与 lima 官方 template:_images/ubuntu-26.04 同一份 release
  - location: "https://cloud-images.ubuntu.com/releases/resolute/release-20260927/ubuntu-26.04-server-cloudimg-arm64.img"
    arch: "aarch64"
    digest: "sha256:63a93bd5a8d76e33b15ceb5daa3657bd79be804748051ab178e643b0f5da22e7"
  # 回退——如果上面链接被删，走滚动 release（不带 digest，会重下）
  - location: "https://cloud-images.ubuntu.com/releases/resolute/release/ubuntu-26.04-server-cloudimg-arm64.img"
    arch: "aarch64"

# 26.04 首次启动把网卡改名成配置里的 interface 名会失败（LP #2136392），
# 不做 optional 时 systemd-networkd-wait-online 会白等约 120s。
# 这是 lima 官方 template:_images/ubuntu-26.04 注入的参数；本文件内联镜像不会继承，故显式声明。
param:
  internal_netplanOptional: "true"

containerd:
  system: false
  user: false

# 装恢复工具
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends \
        mdadm lvm2 btrfs-progs rsync smartmontools \
        htop ncdu tree vim

probes: []
copyToHost: []
