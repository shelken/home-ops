#ref: https://github.com/lima-vm/lima/blob/master/templates/default.yaml

env:
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""

cpus: 8
memory: 14G
disk: 80G

# 映射到vm中的目录为`/mnt/lima-longhorn`
additionalDisks:
  - name: "longhorn"
    format: false

ssh:
  localPort: 60122

hostResolver:
  enabled: false

# eth0 dns
# 使用ansible管理
# dns:
#   - 192.168.6.1

# user:
#   name: &username shelken

# https://lima-vm.io/docs/config/network/vmnet/
# arm架构使用vznat
# 如果要获取路由器网络ip，使用bridged（需要安装socket_vmnet）
# 使用这个的理由在于获取路由器ip与让集群网卡使用
networks:
  - lima: bridged
    interface: eth1
    macAddress: "52:55:55:37:34:56"
    # Defaults to 100. Builtin SLIRP network uses 200.
    metric: 100
# - lima: shared
#   interface: lima2
# - vzNAT: true

portForwards:
  - ignore: true
    proto: any
    guestPort: 443
    guestIP: 0.0.0.0
  - ignore: true
    proto: any
    guestPort: 80
    guestIP: 0.0.0.0

images:
  # 固定版本 + digest，只下载一次，后续复用缓存。release-yyyyMMdd 几个月后可能被删，届时改用下一行回退
  - location: "https://cloud-images.ubuntu.com/releases/noble/release-20260518/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
    digest: "sha256:53fdde898feed8b027d94baa9cfe8229867f330a1d9c49dc7d84465ee7f229f7"
  - location: "https://cloud-images.ubuntu.com/releases/noble/release-20260518/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
    digest: "sha256:6a61b967ba4a27dd1966f835a67643073ed55c2860ce3dc1cb0517282e6b8bec"
  # 回退——不带 digest，跟随上游滚动
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"

# containerd is managed by k3s, not by Lima, so the values are set to false here.
containerd:
  system: false
  user: false

# 实例启动或初次安装执行
provision:
  - mode: system
    script: |
      #!/bin/bash
      # 只清理 Lima 自己的历史遗留静态配置。
      # 不准删 50-cloud-init.yaml：那是 Lima/cloud-init 生成的 eth0/eth1 寻址基线，
      # 删除后 guest 所有网口失去 DHCP，Ansible 尚未接管前节点彻底失联。
      # 网络最终由 Ansible 的 50-node-network.yaml 接管。
      rm -f /etc/netplan/99-eth1.yaml /etc/netplan/90-eth1.yaml
      netplan apply || true
      # Lima cidata 20-rootless-base.sh 无条件 loginctl enable-linger，
      # 但本机 k3s 用 root containerd，不需要 rootless user manager 常驻。
      # 关闭 linger 避免 systemd 255 mountinfo churn 堆积内存（见 postmortem 015、issue #1301）。
      loginctl disable-linger shelken 2>/dev/null || true

      # 注入 mio 的公钥。
      # 不能用 Lima 的 ssh.loadDotSSHPubKeys：它注入的是**宿主**的 ~/.ssh/*.pub，
      # 而宿主密钥与 mio 不是同一把，Ansible/ssh 从 mio 直连 guest 仍会被拒。
      # 用 getent 取家目录，避免写死 /home/<user>（Ubuntu cloud image 用 shelken.guest）。
      # 幂等：已存在则不重复追加。
      pubkey='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN9sMBAahOZKZ5QXBEsu6ACfgX8TSt5EgD+E1h6mtzG2 shelken@mio'
      home_dir="$(getent passwd shelken | cut -d: -f6)"
      install -d -m 700 -o shelken -g shelken "$home_dir/.ssh"
      touch "$home_dir/.ssh/authorized_keys"
      grep -qxF "$pubkey" "$home_dir/.ssh/authorized_keys" \
        || echo "$pubkey" >> "$home_dir/.ssh/authorized_keys"
      chmod 600 "$home_dir/.ssh/authorized_keys"
      chown shelken:shelken "$home_dir/.ssh/authorized_keys"

